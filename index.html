function saveSession(s){session=s?{...s,expires_at:s.expires_at||Math.floor(Date.now()/1000)+(s.expires_in||3600)}:null;s?store.set('mat10_session',session):store.del('mat10_session')}
async function raw(path,{method='GET',body,auth=true,prefer}={}){
  const h={apikey:SB_KEY,'Content-Type':'application/json'};
  if(auth&&session)h.Authorization='Bearer '+session.access_token;
  if(prefer)h.Prefer=prefer;
  const r=await fetch(SB_URL+path,{method,headers:h,body:body===undefined?undefined:JSON.stringify(body)});
  let out=await r.text();try{out=out?JSON.parse(out):null}catch{}
  if(!r.ok){const e=new Error(out?.message||out?.msg||out?.error_description||out?.error||('Error '+r.status));e.status=r.status;throw e}
  return out;
}
let refreshing=null;
async function refreshToken(){
  if(!session?.refresh_token)return false;
  refreshing??=raw('/auth/v1/token?grant_type=refresh_token',{method:'POST',auth:false,body:{refresh_token:session.refresh_token}})
    .then(s=>{saveSession(s);return true}).catch(e=>{if(e.status===400||e.status===401){saveSession(null)}return false}).finally(()=>{refreshing=null});
  return refreshing;
}
async function api(path,opt={}){
  if(opt.auth!==false&&session&&session.expires_at*1000-Date.now()<90000)await refreshToken();
  try{return await raw(path,opt)}
  catch(e){if((e.status===401||/jwt/i.test(e.message))&&await refreshToken())return raw(path,opt);
    if(!navigator.onLine)e.message='Sin conexión a internet. No se guardó nada.';throw e}
}

function loadImg(file){return new Promise((res,rej)=>{const u=URL.createObjectURL(file),i=new Image();i.onload=()=>res(i);i.onerror=()=>{URL.revokeObjectURL(u);rej(Error('No se pudo leer la foto'))};i.src=u})}

  const c=document.createElement('canvas');c.width=Math.round(img.naturalWidth*k);c.height=Math.round(img.naturalHeight*k);c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(img.src);
  return new Promise(r=>c.toBlob(b=>r(b||file),'image/jpeg',0.8))}

async function saveWork(btn){

  return S.moves.filter(m=>m.movement_type==='retiro'&&m.performed_by===myId()).map(m=>({...m,left:m.quantity-(returned[m.id]||0)})).filter(m=>m.left>0);
}

async function saveMove(btn){
  const qty=Number(MV.qty);if(!Number.isInteger(qty)||qty<=0)return toast('Cantidad inválida','bad');
  let orig=null;if(MV.type==='devolucion'){orig=myOpenWithdrawals().find(o=>o.id===MV.orig);if(!orig)return toast('Elegí el retiro que devolvés','bad');if(qty>orig.left)return toast('No podés devolver más de '+orig.left,'bad');MV.part=orig.part_id}
  const it=S.inv.find(i=>i.id===MV.part);if(!it)return toast('Elegí el repuesto','bad');
  if(MV.type==='retiro'&&qty>Number(it.stock_quantity))return toast('No hay stock suficiente (hay '+it.stock_quantity+')','bad');
  const m=MACHINES.find(x=>machineLabel(x)===MV.machine);
  const verb={retiro:'descontar',devolucion:'devolver',entrada:'ingresar'}[MV.type];
  if(!confirm(`¿Confirmás ${verb} ${qty} × ${it.part_name}?`))return;
  await busy(btn,async()=>{try{
    await rpc('register_spare_part_movement',{p_part_id:it.id,p_movement_type:MV.type,p_quantity:qty,p_machine_code:m?.id||orig?.machine_code||null,p_machine_name:m?.name||orig?.machine_name||null,p_work_task_id:null,p_unit_cost:MV.type==='entrada'&&MV.cost!==''?Number(MV.cost):null,p_notes:MV.notes.trim()||null,p_original_movement_id:orig?.id||null});
    toast('Movimiento registrado. Stock actualizado.','good');MV={type:MV.type,part:'',qty:1,machine:'',orig:'',cost:'',notes:''};await refresh();render();
  }catch(e){toast(/ingresos/i.test(e.message)?'Tu usuario no tiene permiso para ingresar stock. Hay que instalar el SQL de la V10.':e.message,'bad')}});
}
async function newPart(btn){
  const code=$('nCode').value.trim(),name=$('nName').value.trim(),qty=Number($('nQty').value||0),min=Number($('nMin').value||0);
  if(!code||!name)return toast('Completá código y nombre','bad');
  if(!Number.isInteger(qty)||qty<0||!Number.isInteger(min)||min<0)return toast('Revisá las cantidades','bad');
  if(S.inv.some(i=>i.part_code.toLowerCase()===code.toLowerCase()))return toast('Ya existe un repuesto con ese código','bad');
  const codes=pkCodes('new');if(!codes.length)return toast('Tildá para qué máquinas sirve (o «Uso general»)','bad');
  const m=codes[0]!==GEN?MACHINES.find(x=>x.id===codes[0]):null;
  await busy(btn,async()=>{try{
    await rpc('add_spare_part',{p_part_code:code,p_part_name:name,p_minimum_stock:min,p_initial_quantity:qty,p_storage_location:$('nLoc').value.trim()||null,p_machine_code:m?.id||null,p_machine_name:m?.name||null});
    await refresh();let warn='';
    const it=S.inv.find(i=>String(i.part_code).toLowerCase()===code.toLowerCase());
    if(S.v124Missing)warn='Falta el SQL de la V12.4: solo quedó guardada la primera máquina.';
    else if(it){try{await setPartMachines(it.id,codes)}catch(e){warn='No se guardaron las máquinas: '+v124Msg(e)}}
    delete PK.new;warn?toast('Repuesto agregado. '+warn,'bad'):toast('Repuesto agregado','good');render();
  }catch(e){toast(/add_spare_part|function|schema cache/i.test(e.message)?'Falta instalar el SQL de la V10 en Supabase (función add_spare_part).':e.message,'bad')}});
}

/* ===================== AVISOS PUSH ===================== */
const pushSupported=()=>'serviceWorker' in navigator&&'PushManager' in window&&'Notification' in window;
const b64u=s=>{const b=atob((s+'='.repeat((4-s.length%4)%4)).replace(/-/g,'+').replace(/_/g,'/'));return Uint8Array.from(b,c=>c.charCodeAt(0))};
async function pushState(){if(isIOS()&&!isStandalone())return 'instalar';if(!pushSupported())return 'nosoporta';if(Notification.permission==='denied')return 'bloqueado';
  try{const reg=await navigator.serviceWorker.ready;return (await reg.pushManager.getSubscription())?'on':'off'}catch{return 'off'}}
async function saveSub(sub){const j=sub.toJSON();await rpc('save_push_subscription',{p_endpoint:j.endpoint,p_p256dh:j.keys.p256dh,p_auth:j.keys.auth,p_user_agent:navigator.userAgent})}
async function enablePush(btn){
  if(isIOS()&&!isStandalone())return toast('En iPhone primero instalá la app (Compartir → Agregar a pantalla de inicio) y abrila desde el ícono.','bad');
  if(!pushSupported())return toast('Este navegador no permite avisos. En Android usá Chrome.','bad');
  const perm=Notification.requestPermission(); // tiene que ser lo primero después del toque (iPhone)
  await busy(btn,async()=>{try{
    if(await perm!=='granted'){S.pushOn=Notification.permission==='denied'?'bloqueado':'off';render();return toast('No diste permiso para los avisos','bad')}
    const reg=await navigator.serviceWorker.ready;let sub=await reg.pushManager.getSubscription();
    if(!sub)sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64u(VAPID_PUBLIC)});
    await saveSub(sub);S.pushOn='on';toast('Avisos activados en este celular 🔔','good');render();
  }catch(e){toast('No se pudieron activar: '+(/save_push|schema cache/i.test(e.message)?'falta instalar el SQL de la V11.':e.message),'bad')}})}
async function testPush(btn){await busy(btn,async()=>{try{const n=await rpc('test_push');toast(n?'Aviso de prueba enviado. Tiene que llegar en unos segundos.':'Este usuario no tiene avisos activados en ningún celular.',n?'good':'bad')}catch(e){toast(e.message,'bad')}})}
async function syncPush(){S.pushOn=await pushState();if(S.pushOn!=='on')return;try{const reg=await navigator.serviceWorker.ready;const sub=await reg.pushManager.getSubscription();if(sub)await saveSub(sub)}catch{}}
async function unlinkPush(){try{const reg=await navigator.serviceWorker.ready;const sub=await reg.pushManager.getSubscription();if(sub){await rpc('delete_push_subscription',{p_endpoint:sub.endpoint}).catch(()=>{});await sub.unsubscribe()}}catch{}}
function pushBanner(){const st=S.pushOn;if(!st||st==='on'||st==='nosoporta'||S.v11Missing)return '';
  if(st==='instalar')return `<div class="note" style="margin-bottom:12px">🔔 Para recibir avisos de tareas nuevas en el iPhone, instalá la app: <b>Compartir → Agregar a pantalla de inicio</b> y abrila desde el ícono.</div>`;
  if(st==='bloqueado')return `<div class="note" style="margin-bottom:12px">🔕 Los avisos están bloqueados en este celular. Activalos en Ajustes → Notificaciones → Matenimiento (o en los permisos del sitio en Chrome).</div>`;
  return `<div class="card alta"><div class="title">🔔 Activá los avisos</div><p class="muted small" style="margin:6px 0 0">Así te llega una notificación cuando te asignan una tarea, aunque tengas la app cerrada.</p><button class="btn yel block" onclick="enablePush(this)">Activar avisos en este celular</button></div>`}
function pushCard(){const st=S.pushOn;const t={on:'✅ Activados en este celular',off:'Desactivados',bloqueado:'🔕 Bloqueados en los ajustes del celular',instalar:'Primero hay que instalar la app (iPhone)',nosoporta:'Este navegador no permite avisos'}[st]||'…';
  return `<div class="card"><h3>🔔 Avisos</h3><p class="muted small" style="margin-top:0">Estado: <b>${t}</b></p>
${st==='off'?'<button class="btn yel block" onclick="enablePush(this)">Activar avisos</button>':''}${st==='on'?'<button class="btn ghost block sm" onclick="testPush(this)">Mandarme un aviso de prueba</button>':''}</div>`}

function vMaquinas(){const q=S.machQ.toLowerCase();
  const lev=m=>critOf(m.id)?.level||'NONE';const oos=m=>lev(m)==='NO_FUNCIONA';
  let list=MACHINES.filter(m=>!q||[m.id,m.name,m.sector,m.location].some(v=>v.toLowerCase().includes(q)));
  if(S.critF!=='todas')list=list.filter(m=>lev(m)===S.critF);

async function histPhotos(input){const files=[...input.files].slice(0,MAX_PHOTOS-HE.photos.length);input.value='';if(!files.length)return;
  const b=$('hphBtn');if(b)b.innerHTML='<span class="spin" style="border-color:#bbb;border-top-color:#333"></span> Subiendo foto…';
  let ok=0;for(const f of files){try{HE.photos.push(await uploadPhoto(await shrinkPhoto(f)));ok++}catch(e){toast('Foto no subida: '+e.message,'bad')}}

async function saveHist(btn){const e=HE;if(!e)return;const desc=e.desc.trim();if(!desc)return toast('Contá qué se hizo','bad');
  let date=null;
  if(e.prec==='dia'){if(!e.day)return toast('Elegí la fecha (o tocá «Mes», «Año» o «No sé»)','bad');date=e.day}
  else if(e.prec==='mes'){if(!/^\d{4}-\d{2}$/.test(e.month))return toast('Elegí el mes','bad');date=e.month+'-01'}
  else if(e.prec==='anio'){const y=Number(e.year);if(!Number.isInteger(y)||y<1950||y>new Date().getFullYear())return toast('Revisá el año','bad');date=y+'-01-01'}
  if(date&&date>today())return toast('La fecha no puede ser futura','bad');
  const cost=e.cost===''||e.cost===null?null:Number(e.cost);if(cost!==null&&!(cost>=0))return toast('Revisá el costo','bad');
  const m=MACHINES.find(x=>x.id===e.code);
  const body={machine_code:e.code,machine_name:m?.name||null,event_date:date,date_precision:e.prec,kind:e.kind,description:desc,done_by:(e.ext?e.provider:e.who).trim()||null,external:e.ext,cost,photo_urls:e.photos};
  await busy(btn,async()=>{try{
    if(e.id){body.updated_by=myId();body.updated_at=new Date().toISOString();await api('/rest/v1/machine_history?id=eq.'+e.id,{method:'PATCH',prefer:'return=minimal',body})}
    else await api('/rest/v1/machine_history',{method:'POST',prefer:'return=minimal',body});
    HE=null;await loadHist();toast('Guardado en el historial de la máquina','good');render()}catch(err){toast(v124Msg(err),'bad')}})}

<li><b>Borrar tareas</b> (solo el supervisor): en una tarea pendiente o en proceso, «🗑 Borrar». Se elimina como si no hubiera existido y no se puede deshacer. Las terminadas no se borran.</li>

<div class="info">Se necesita internet para guardar. Si aparece un error en rojo, el dato <b>no</b> se guardó.</div></div>`}

const dObj=d=>new Date(d+'T12:00:00');
const isoD=x=>x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0');
const addDays=(d,n)=>{const x=dObj(d);x.setDate(x.getDate()+n);return isoD(x)};
const ymOf=d=>String(d).slice(0,7);
const ymAdd=(ym,n)=>{const [y,m]=ym.split('-').map(Number);return isoD(new Date(y,m-1+n,1,12)).slice(0,7)};
const monthStart=ym=>ym+'-01';
const monthEnd=ym=>{const [y,m]=ym.split('-').map(Number);return isoD(new Date(y,m,0,12))};
const ymName=ym=>{const [y,m]=ym.split('-').map(Number);return MESES[m-1]+' '+y};
const defProd=d=>{const w=dObj(d).getDay();return w>=1&&w<=5};
const isProd=d=>S.cal[d]?S.cal[d].productive:defProd(d);
const dayLbl=d=>DOW[dObj(d).getDay()]+' '+fmtD(d).slice(0,5);
const orderState=o=>o.status==='cancelado'?'cancelado':o.done_at?'hecho':o.work_task_id?'asignado':'sinasignar';
const machRow=code=>S.machinesAll.find(x=>x.code===code);
const mLabelById=code=>{const m=machRow(code)||MACHINES.find(x=>x.id===code);return m?code+' · '+m.name:code};
const machIdOf=label=>String(label||'').split(' · ')[0];
const team=()=>S.profiles.filter(p=>p.approved&&p.first_name);
const v12Warn=()=>S.v12Missing?`<div class="err" style="margin-bottom:12px">${isSup()?'Falta correr el SQL de la V12 en Supabase (máquinas, plan, calendario, preventivo y avisos).':'Esta parte todavía no está activada. Avisale al supervisor.'}</div>`:'';
const backMas=`<button class="btn ghost sm" onclick="go('mas')">← Más</button>`;

async function loadV12(){
  try{
    const from=addDays(today(),-400),to=addDays(today(),430);
    const [ma,pl,cal,no,ord]=await Promise.all([
      api('/rest/v1/machines?select=*&order=code.asc&limit=2000'),
      isSup()?api('/rest/v1/pm_plan?select=*&order=machine_code.asc,created_at.asc&limit=5000'):Promise.resolve([]),
      api(`/rest/v1/prod_calendar?select=*&day=gte.${from}&day=lte.${to}&limit=2000`),
      api('/rest/v1/team_notices?select=*&order=created_at.desc&limit=60'),
      api(`/rest/v1/pm_orders?select=*&planned_date=gte.${addDays(today(),-14)}&planned_date=lte.${addDays(today(),45)}&order=planned_date.asc&limit=3000`)]);
    S.machinesAll=ma;if(ma.length)MACHINES=ma.filter(m=>m.active).map(m=>({id:m.code,name:m.name,sector:m.sector||'',location:m.location||'',type:m.equipment_type||'',brand:m.brand_model||'',notes:m.notes||''}));
    S.plan=pl;S.cal=Object.fromEntries(cal.map(c=>[c.day,c]));S.notices=no;S.ordersNear=ord;S.v12Missing=false;
  }catch(e){S.v12Missing=true}
}
async function loadOrders(ym,force){
  if(S.v12Missing)return;if(!force&&(S.pmOrders[ym]||S.pmLoading===ym))return;S.pmLoading=ym;
  try{S.pmOrders[ym]=await api(`/rest/v1/pm_orders?select=*&planned_date=gte.${monthStart(ym)}&planned_date=lte.${monthEnd(ym)}&order=planned_date.asc,machine_code.asc&limit=5000`)}
  catch(e){S.pmOrders[ym]=[];toast('No se pudieron cargar los preventivos: '+e.message,'bad')}
  finally{S.pmLoading=null}
  if(['preventivo','calendario'].includes(S.view))render();
}
const findOrder=id=>Object.values(S.pmOrders).flat().concat(S.ordersNear).find(o=>o.id===id);
const taskOf=o=>o.work_task_id?S.tasks.find(t=>t.id===o.work_task_id):null;

/* ---------- PREVENTIVO DEL MES ---------- */
function vPreventivo(){
  const ym=S.pmYm||(S.pmYm=ymOf(today()));const all=S.pmOrders[ym];
  if(!S.v12Missing&&!all)loadOrders(ym);
  const nav=`<div class="line" style="margin-bottom:10px"><button class="btn ghost sm" onclick="S.pmYm=ymAdd(S.pmYm,-1);render()">‹</button><h3 style="margin:0">${ymName(ym)}</h3><button class="btn ghost sm" onclick="S.pmYm=ymAdd(S.pmYm,1);render()">›</button></div>`;
  let h=`${backMas}<h2>🛠 Preventivo</h2>${v12Warn()}${nav}`;
  if(S.v12Missing)return h;if(!all)return h+'<p class="muted">Cargando…</p>';
  const cnt=k=>all.filter(o=>orderState(o)===k).length,act=all.filter(o=>o.status!=='cancelado');
  const pct=act.length?Math.round(cnt('hecho')*100/act.length):0;
  const venc=all.filter(o=>['sinasignar','asignado'].includes(orderState(o))&&o.planned_date<today()).length;
  h+=`<div class="stats"><div class="stat ${cnt('sinasignar')?'yel':''}" onclick="S.pmF='sinasignar';render()"><b>${cnt('sinasignar')}</b><span>Sin asignar</span></div><div class="stat" onclick="S.pmF='asignado';render()"><b>${cnt('asignado')}</b><span>Asignados</span></div><div class="stat" onclick="S.pmF='hecho';render()"><b>${cnt('hecho')}</b><span>Hechos · ${pct}% cumplido</span></div><div class="stat ${venc?'red':''}" onclick="S.pmF='vencidos';render()"><b>${venc}</b><span>Vencidos sin hacer</span></div></div>`;
  if(isBoss())h+=`<div class="actions" style="margin-bottom:12px"><button class="btn sec sm" onclick="genOrders(this,'gen')">⚙️ Generar los que falten</button><button class="btn ghost sm" onclick="genOrders(this,'re')">📅 Reprogramar según calendario</button><button class="btn ghost sm" onclick="go('calendario')">Ver calendario</button></div>`;
  const F=S.pmF||'sinasignar',q=(S.pmQ||'').toLowerCase();
  h+=`<div class="seg">${[['sinasignar','Sin asignar'],['asignado','Asignados'],['hecho','Hechos'],['vencidos','Vencidos'],['todos','Todos']].map(([k,t])=>`<button class="${F===k?'on':''}" onclick="S.pmF='${k}';render()">${t}</button>`).join('')}</div>
<input placeholder="Buscar máquina o tarea…" value="${esc(S.pmQ||'')}" oninput="S.pmQ=this.value;clearTimeout(window._pq);window._pq=setTimeout(()=>{render();const i=document.querySelector('#app input');if(i){i.focus();i.setSelectionRange(i.value.length,i.value.length)}},350)" style="margin-bottom:10px">`;
  let list=all.filter(o=>F==='todos'?true:F==='vencidos'?(['sinasignar','asignado'].includes(orderState(o))&&o.planned_date<today()):orderState(o)===F);
  if(q)list=list.filter(o=>(mLabelById(o.machine_code)+' '+o.task).toLowerCase().includes(q));
  if(!all.length)return h+`<div class="card muted">No hay preventivos programados en ${ymName(ym)}.${isBoss()?' Tocá <b>Generar los que falten</b>.':''}</div>`;
  if(!list.length)return h+'<div class="card muted">No hay preventivos en este filtro.</div>';
  const byDay={};[...list].sort((a,b)=>a.planned_date<b.planned_date?-1:a.planned_date>b.planned_date?1:a.machine_code<b.machine_code?-1:1).forEach(o=>(byDay[o.planned_date]??=[]).push(o));
  return h+Object.entries(byDay).map(([d,os])=>`<h3>${dayLbl(d)} ${isProd(d)?'':'<span class="badge b-alta">No productivo</span>'} <span class="muted small">· ${os.length} · ${Math.round(os.reduce((s,o)=>s+(o.hours||0)*(o.techs||1),0)*10)/10} HH</span></h3>${os.map(orderCard).join('')}`).join('');
}
function orderCard(o){
  const st=orderState(o),t=taskOf(o),stop=Number(o.stop_hours)||0;
  let x=`<div class="card ${st==='hecho'?'':st==='sinasignar'&&o.planned_date<today()?'urgent':'accent'}"><div class="line"><div><div class="title">${esc(o.task)}</div><div class="muted small">${esc(mLabelById(o.machine_code))} ${critBadge(o.machine_code,true)}</div></div><div style="text-align:right">${badge(OST,st)}</div></div>
<div class="muted small" style="margin-top:6px">🔁 ${esc(o.frequency||'')} · ⏱ ${o.techs||1} × ${o.hours||0} h${stop?` · ⛔ parada ${stop} h${stop<=1?' (cambio de turno)':''}`:''}${t?` · 👤 ${esc(nameOf(t.assigned_to))}`:''}${o.done_at?` · ✓ ${fmtDT(o.done_at)}`:''}${o.cancel_reason?` · ${esc(o.cancel_reason)}`:''}</div>`;
  if(isBoss()&&st==='sinasignar')x+=`<div class="row" style="margin-top:8px"><select id="po_${o.id}"><option value="">Asignar a…</option>${team().map(p=>`<option value="${p.id}">${esc(p.first_name+' '+(p.last_name||''))}</option>`).join('')}</select><button class="btn sm" style="flex:0 0 auto" onclick="assignOrder(this,'${o.id}')">Asignar</button></div>
<details style="margin-top:8px"><summary class="small">Cambiar fecha o cancelar</summary><div class="row" style="margin-top:8px"><input type="date" id="pd_${o.id}" value="${o.planned_date}"><button class="btn sec sm" style="flex:0 0 auto" onclick="moveOrder(this,'${o.id}')">Cambiar fecha</button></div><button class="btn ghost sm" style="margin-top:8px" onclick="cancelOrder(this,'${o.id}')">✕ Cancelar este preventivo</button></details>`;
  if(isBoss()&&st==='cancelado')x+=`<button class="btn ghost sm" style="margin-top:8px" onclick="patchOrder(this,'${o.id}',{status:'programado',cancel_reason:null},'Preventivo reactivado')">↺ Reactivar</button>`;
  return x+'</div>';
}
async function reloadOrdersFor(o){await Promise.all([loadOrders(ymOf(o.planned_date),true),S.pmYm&&S.pmYm!==ymOf(o.planned_date)?loadOrders(S.pmYm,true):null])}
async function assignOrder(btn,id){const who=$('po_'+id)?.value,o=findOrder(id);if(!who)return toast('Elegí el operario','bad');
  await busy(btn,async()=>{try{await rpc('assign_pm_order',{p_order:id,p_user:who,p_machine_label:mLabelById(o.machine_code)});toast('Preventivo asignado a '+nameOf(who),'good');await refresh();await reloadOrdersFor(o)}catch(e){toast(e.message,'bad')}})}
async function patchOrder(btn,id,body,msg){const o=findOrder(id);
  await busy(btn,async()=>{try{await api('/rest/v1/pm_orders?id=eq.'+id,{method:'PATCH',prefer:'return=minimal',body});toast(msg,'good');await reloadOrdersFor(o);await loadV12();render()}catch(e){toast(e.message,'bad')}})}
function moveOrder(btn,id){const d=$('pd_'+id).value;if(!d)return toast('Elegí la fecha','bad');
  if(!isProd(d)||confirm(`El ${dayLbl(d)} es día productivo. Si la tarea necesita parar la máquina, coordinalo con producción. ¿Cambiar igual?`))patchOrder(btn,id,{planned_date:d},'Fecha cambiada a '+dayLbl(d))}
function cancelOrder(btn,id){const r=prompt('¿Por qué se cancela? (por ejemplo: máquina parada, se hizo en un correctivo)');if(r===null)return;patchOrder(btn,id,{status:'cancelado',cancel_reason:r.trim()||'Cancelado'},'Preventivo cancelado')}
async function genOrders(btn,mode){const ym=S.pmYm;
  if(mode==='re'&&!confirm(`Se vuelven a elegir los días de los preventivos SIN asignar de ${ymName(ym)}, según el calendario de producción. Los asignados no se tocan. ¿Seguimos?`))return;
  await busy(btn,async()=>{try{const n=await rpc(mode==='re'?'reschedule_pm_orders':'generate_pm_orders',{p_from:monthStart(ym),p_to:monthEnd(ym)});
    toast(mode==='re'?`Listo: ${n} preventivos reprogramados`:n?`Se generaron ${n} preventivos nuevos`:'No faltaba generar ninguno','good');await loadOrders(ym,true);await loadV12()}catch(e){toast(e.message,'bad')}})}

/* ---------- CALENDARIO DE PRODUCCIÓN ---------- */
function vCalendario(){
  const ym=S.calYm||(S.calYm=ymOf(today()));const ords=S.pmOrders[ym];if(!S.v12Missing&&!ords)loadOrders(ym);
  const first=monthStart(ym),last=monthEnd(ym);const pad=(dObj(first).getDay()+6)%7;
  const per={};(ords||[]).filter(o=>o.status!=='cancelado').forEach(o=>per[o.planned_date]=(per[o.planned_date]||0)+1);
  let cells='';for(let i=0;i<pad;i++)cells+='<div></div>';
  for(let d=first;d<=last;d=addDays(d,1)){const p=isProd(d),ov=!!S.cal[d];
    cells+=`<div class="cal-d ${p?'prod':'noprod'} ${ov?'ov':''} ${d===today()?'hoy':''}" ${isSup()&&!S.v12Missing?`onclick="toggleDay('${d}')"`:''}><b>${Number(d.slice(8))}</b>${per[d]?`<span>🛠${per[d]}</span>`:''}</div>`}
  const ovs=Object.values(S.cal).filter(c=>ymOf(c.day)===ym).sort((a,b)=>a.day<b.day?-1:1);
  return `${backMas}<h2>📅 Calendario de producción</h2>${v12Warn()}
<div class="line" style="margin-bottom:10px"><button class="btn ghost sm" onclick="S.calYm=ymAdd(S.calYm,-1);render()">‹</button><h3 style="margin:0">${ymName(ym)}</h3><button class="btn ghost sm" onclick="S.calYm=ymAdd(S.calYm,1);render()">›</button></div>
<div class="card"><div class="cal">${DOW.slice(1).concat('Dom').map(x=>`<div class="cal-h">${x}</div>`).join('')}${cells}</div>
<div class="small muted" style="margin-top:10px"><span class="cal-k prod"></span> Se produce (3 turnos) &nbsp; <span class="cal-k noprod"></span> No se produce &nbsp; <span class="cal-k ov"></span> Cambiado a mano · 🛠 preventivos del día</div></div>
${isSup()?'<div class="info small">Tocá un día para cambiarlo: un <b>sábado</b> que se trabaja pasa a productivo; un <b>feriado</b> o día que no se trabaja pasa a no productivo. Las tareas que necesitan parar la máquina más de 1 hora se programan en días no productivos. Después de cambiar días, en <b>Preventivo</b> tocá <b>Reprogramar según calendario</b>.</div>':'<div class="info small">El calendario lo marca el supervisor. Lunes a viernes se produce (también los feriados, salvo que se marque lo contrario).</div>'}
${ovs.length?`<h3>Cambios de este mes</h3><div class="card">${ovs.map(c=>`<div class="list-item small">${dayLbl(c.day)}: <b>${c.productive?'se produce':'no se produce'}</b>${c.note?' · '+esc(c.note):''}</div>`).join('')}</div>`:''}`;
}
async function toggleDay(d){const np=!isProd(d);const w=DOW[dObj(d).getDay()];
  let note=null;if(np!==defProd(d)){note=prompt(np?`¿Marcar el ${dayLbl(d)} como día que SE PRODUCE? Podés escribir una nota (opcional):`:`¿Marcar el ${dayLbl(d)} como día que NO se produce (feriado, parada de planta…)? Podés escribir una nota (opcional):`,np?'Sábado productivo':(w==='Sáb'||w==='Dom'?'':'Feriado sin producción'));if(note===null)return}
  else if(!confirm(`¿Volver el ${dayLbl(d)} a lo normal (${np?'se produce':'no se produce'})?`))return;
  try{await rpc('set_production_day',{p_day:d,p_productive:np,p_note:note});if(np===defProd(d))delete S.cal[d];else S.cal[d]={day:d,productive:np,note};
    toast(`${dayLbl(d)}: ${np?'se produce':'no se produce'}. Acordate de reprogramar los preventivos.`,'good');render()}catch(e){toast(e.message,'bad')}}

/* ---------- PLAN PREVENTIVO ---------- */
function planSheet(){const plan=[...S.plan].sort((a,b)=>a.machine_code<b.machine_code?-1:a.machine_code>b.machine_code?1:0);
  return {name:'Plan preventivo',title:'Plan de mantenimiento preventivo',sub:`${plan.filter(p=>p.active).length} tareas activas · generado ${fmtDT(new Date())} por ${nameOf(myId())}. Criticidad: A = ALTA, B = MEDIA, C = BAJA.`,
   head:['ID activo','Activo','Sector','Crit. (A/B/C)','Tarea / intervención','Tipo de mantenimiento','Frecuencia','Mes de inicio (1-12)','Eventos por año','Oficio','Cant. técnicos','Horas por evento','HH por evento','HH anuales','Horas de parada por evento','Activa','Observaciones'],
   w:[10,28,13,10,60,20,13,10,10,24,10,10,10,10,12,8,40],
   rows:plan.map(p=>{const m=machRow(p.machine_code),c=critOf(p.machine_code),n=FREQ_N[p.frequency]||0,hh=(Number(p.hours)||0)*(Number(p.techs)||1);
     return [p.machine_code,m?.name||'',m?.sector||'',c?ABC[c.level]:'',p.task,p.maint_type||'',p.frequency,Number(p.start_month),n,p.trade||'',Number(p.techs),{n:Number(p.hours),f:2},{n:hh,f:2},{n:hh*n,f:2},{n:Number(p.stop_hours)||0,f:2},p.active?'Sí':'No',p.notes||'']})}}
function vPlan(){
  if(!isSup())return `${backMas}<h2>📋 Plan preventivo</h2><div class="card muted">El plan preventivo lo ve solo el supervisor.</div>`;
  let h=`${backMas}<h2>📋 Plan preventivo</h2>${v12Warn()}`;if(S.v12Missing)return h;
  const q=(S.planQ||'').toLowerCase(),only=S.planMach;
  const act=S.plan.filter(p=>p.active),hh=act.reduce((s,p)=>s+(Number(p.hours)||0)*(Number(p.techs)||1)*(FREQ_N[p.frequency]||0),0);
  h+=`<div class="card"><div class="muted small">${act.length} tareas activas en ${new Set(act.map(p=>p.machine_code)).size} máquinas · ${Math.round(hh)} horas-hombre por año</div><div class="actions" style="margin-top:8px"><button class="btn sec sm" onclick="planDownload(this)">⬇️ Descargar plan en Excel</button>${only?`<button class="btn ghost sm" onclick="S.planMach='';render()">Ver todas las máquinas</button>`:''}</div></div>`;
  if(!only)h+=`<input placeholder="Buscar máquina o tarea…" value="${esc(S.planQ||'')}" oninput="S.planQ=this.value;clearTimeout(window._lq);window._lq=setTimeout(()=>{render();const i=document.querySelector('#app input');if(i){i.focus();i.setSelectionRange(i.value.length,i.value.length)}},350)" style="margin-bottom:10px">
<label class="small" style="font-weight:400"><input type="checkbox" style="width:auto" ${S.planOff?'checked':''} onchange="S.planOff=this.checked;render()"> Mostrar también las tareas desactivadas</label>`;
  const ms=MACHINES.filter(m=>only?m.id===only:true);
  const blocks=ms.map(m=>{let ps=S.plan.filter(p=>p.machine_code===m.id&&(S.planOff||p.active));
    if(q&&!(m.id+' '+m.name).toLowerCase().includes(q))ps=ps.filter(p=>p.task.toLowerCase().includes(q));
    if(q&&!ps.length&&!(m.id+' '+m.name).toLowerCase().includes(q))return '';
    return `<div class="card"><div class="line"><div class="title">${esc(machineLabel(m))}</div><div>${critBadge(m.id,true)}</div></div>
${ps.map(p=>`<div class="list-item" ${isBoss()?`onclick="go('planedit',{planId:'${p.id}'})" style="cursor:pointer;${p.active?'':'opacity:.5'}"`:''}><div class="small"><b>${esc(p.task)}</b>${p.active?'':' <span class="badge">Desactivada</span>'}<br><span class="muted">🔁 ${esc(p.frequency)} desde ${MESES[p.start_month-1]} · ${esc(p.trade||'')} · ${p.techs} × ${p.hours} h${Number(p.stop_hours)?` · ⛔ parada ${p.stop_hours} h`:''}${p.maint_type&&p.maint_type!=='Preventivo'?' · '+esc(p.maint_type):''}</span></div></div>`).join('')||'<p class="muted small">Sin tareas de preventivo.</p>'}
${isBoss()?`<button class="btn ghost sm" style="margin-top:8px" onclick="go('planedit',{planId:'',planMachNew:'${m.id}'})">＋ Agregar tarea</button>`:''}</div>`}).join('');
  return h+(blocks||'<div class="card muted">No se encontró nada.</div>');
}
async function planDownload(btn){await busy(btn,async()=>{try{const b=xlsx([planSheet()]);const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=`Plan preventivo Facilitas ${today()}.xlsx`;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000);toast('Excel del plan descargado','good')}catch(e){toast(e.message,'bad')}})}
function vPlanEdit(){if(!isSup())return vPlan();
  const p=S.plan.find(x=>x.id===S.planId)||{machine_code:S.planMachNew||'',task:'',maint_type:'Preventivo',frequency:'Mensual',start_month:1,trade:'Técnico de mantenimiento',techs:1,hours:1,stop_hours:0,notes:'',active:true};
  const opt=(arr,v)=>arr.map(x=>`<option ${x==v?'selected':''}>${esc(x)}</option>`).join('');

<label>Máquina</label><select id="peM">${MACHINES.map(m=>`<option value="${m.id}" ${m.id===p.machine_code?'selected':''}>${esc(machineLabel(m))}</option>`).join('')}</select>
<label>Tarea / intervención</label><textarea id="peT">${esc(p.task)}</textarea>
<div class="row"><div><label>Frecuencia</label><select id="peF">${opt(FREQS,p.frequency)}</select></div><div><label>Mes de inicio</label><select id="peS">${MESES.map((x,i)=>`<option value="${i+1}" ${i+1==p.start_month?'selected':''}>${x}</option>`).join('')}</select></div></div>
<p class="muted small" style="margin:4px 0 0">El mes de inicio sirve para las tareas bimestrales o más espaciadas: por ejemplo, una trimestral que empieza en febrero se hace en febrero, mayo, agosto y noviembre.</p>
<div class="row"><div><label>Tipo</label><select id="peY">${opt(MTYPES,p.maint_type)}</select></div><div><label>Oficio</label><select id="peO">${opt(TRADES,p.trade)}</select></div></div>
<div class="row"><div><label>Técnicos</label><input id="peN" type="number" min="1" step="1" inputmode="numeric" value="${p.techs}"></div><div><label>Horas por vez</label><input id="peH" type="number" min="0" step="0.5" inputmode="decimal" value="${p.hours}"></div><div><label>Parada de máquina (h)</label><input id="peP" type="number" min="0" step="0.5" inputmode="decimal" value="${p.stop_hours}"></div></div>
<p class="muted small" style="margin:4px 0 0">Si la parada es de más de 1 hora, el preventivo se programa en un día que no se produce. Si es de 1 hora o menos, en un día hábil (para coordinarlo en un cambio de turno).</p>
<label>Observaciones</label><textarea id="peX">${esc(p.notes||'')}</textarea>
${p.id?`<label class="small" style="font-weight:400"><input type="checkbox" id="peA" style="width:auto" ${p.active?'checked':''}> Tarea activa (si la desactivás, deja de generar preventivos)</label>`:''}
<button class="btn block" onclick="savePlan(this)">Guardar</button></div>

  const T=Object.fromEntries(tk.map(t=>[t.id,t])),H=s=>Math.round(s/36)/100,td=today();
  const done=o=>!!o.done_at,act=orders.filter(o=>o.status!=='cancelado');
  const late=o=>o.status!=='cancelado'&&!o.done_at&&o.planned_date<td;
  const onTime=o=>done(o)?(new Date(o.done_at).toLocaleDateString('en-CA',{timeZone:TZ})<=o.planned_date?'Sí':'Con atraso'):late(o)?'Vencido':'';
  const ST={sinasignar:'Sin asignar',asignado:'Asignado',hecho:'Hecho',cancelado:'Cancelado'};
  const real=o=>{const t=T[o.work_task_id];return t?H(taskSeconds(t)):0};
  sheets.push({name:'Preventivo plan vs real',title:'Preventivo: plan vs. real',sub:`${act.length} programados · ${act.filter(done).length} hechos · ${act.length?Math.round(act.filter(done).length*100/act.length):0}% de cumplimiento · ${fmtD(from)} al ${fmtD(to)}`,
    head:['Fecha programada','Día','Código','Máquina','Sector','Crit.','Tarea','Frecuencia','HH plan','Parada (h)','Estado','Asignado a','Finalizada','Horas reales (reloj)','A tiempo','Motivo cancelación'],
    w:[12,6,10,28,13,6,55,12,9,9,11,20,16,12,11,28],
    rows:orders.map(o=>{const m=machRow(o.machine_code),c=critOf(o.machine_code),t=T[o.work_task_id];
      return [fmtD(o.planned_date),DOW[dObj(o.planned_date).getDay()],o.machine_code,m?.name||'',m?.sector||'',c?ABC[c.level]:'',o.task,o.frequency||'',{n:(o.hours||0)*(o.techs||1),f:2},{n:Number(o.stop_hours)||0,f:2},ST[orderState(o)],t?nameOf(t.assigned_to):'',o.done_at?fmtDT(o.done_at):'',t?{n:real(o),f:2}:'',onTime(o),o.cancel_reason||'']})});
  const per={};act.forEach(o=>{const p=per[o.machine_code]??={n:0,d:0,hh:0,r:0,v:0};p.n++;if(done(o))p.d++;p.hh+=(o.hours||0)*(o.techs||1);p.r+=real(o);if(late(o))p.v++});
  const rowsC=Object.entries(per).sort((a,b)=>(a[1].d/a[1].n)-(b[1].d/b[1].n)).map(([code,p])=>{const m=machRow(code),c=critOf(code);return [code,m?.name||'',m?.sector||'',c?ABC[c.level]:'',p.n,p.d,{n:p.n?p.d/p.n*100:0,f:2},{n:p.hh,f:2},{n:p.r,f:2},p.v]});
  const tot=Object.values(per).reduce((s,p)=>({n:s.n+p.n,d:s.d+p.d,hh:s.hh+p.hh,r:s.r+p.r,v:s.v+p.v}),{n:0,d:0,hh:0,r:0,v:0});
  rowsC.unshift(['TOTAL','Todas las máquinas','','',tot.n,tot.d,{n:tot.n?tot.d/tot.n*100:0,f:2},{n:tot.hh,f:2},{n:tot.r,f:2},tot.v]);
  sheets.push({name:'Cumplimiento preventivo',title:'Cumplimiento del preventivo por máquina',sub:'Ordenado de menor a mayor cumplimiento. No cuenta los cancelados. Horas reales = reloj de la tarea (Iniciar → Finalizar, sin pausas).',head:['Código','Máquina','Sector','Crit.','Programados','Hechos','% cumplimiento','HH plan','Horas reales','Vencidos sin hacer'],w:[10,30,14,6,12,10,14,10,12,14],rows:rowsC});
  sheets.push(planSheet());
  sheets[0].rows.push(['Preventivos programados en el período',tot.n],['Preventivos hechos',tot.d],['% de cumplimiento del preventivo',{n:tot.n?Math.round(tot.d/tot.n*1000)/10:0,f:2}],['Preventivos vencidos sin hacer',tot.v]);
}

const APP_URL='https://ferfacilitas.github.io/matenimiento-facilitas/';

const loadScript=src=>new Promise((res,rej)=>{if(document.querySelector(`script[data-src="${src}"]`))return res();const s=document.createElement('script');s.src=src;s.dataset.src=src;s.onload=res;s.onerror=()=>rej(Error('No se pudo cargar '+src+'. Revisá la conexión.'));document.head.append(s)});
let SCAN={stream:null,raf:0,busy:false};
function stopScan(){cancelAnimationFrame(SCAN.raf);SCAN.raf=0;if(SCAN.stream){SCAN.stream.getTracks().forEach(t=>t.stop());SCAN.stream=null}}
function codeFromQr(txt){const t=String(txt||'').trim();let c='';
  try{const u=new URL(t);c=u.searchParams.get('m')||''}catch{c=t}
  return c.toUpperCase().replace(/\s+/g,'')}
function vEscanear(){return `<button class="btn ghost sm" onclick="go('inicio')">← Volver</button><h2>📷 Escanear máquina</h2>
<div class="card" style="padding:8px"><div class="scanbox"><video id="scVid" playsinline muted autoplay></video><div class="scanframe"></div></div><p class="muted small" id="scMsg" style="text-align:center;margin:8px 0 0">Abriendo la cámara…</p></div>
<div class="info small">Apuntá a la etiqueta QR de la máquina, a unos 15–25 cm. Se abre sola la ficha de la máquina: desde ahí registrás el trabajo, cargás una emergencia o ves sus tareas y su plan.</div>
<details class="card" style="margin-top:12px"><summary class="small">¿No anda la cámara? Escribí el código</summary><div class="row" style="margin-top:8px"><input id="scCode" placeholder="Ej.: HOR-04" style="text-transform:uppercase"><button class="btn sm" style="flex:0 0 auto" onclick="openMachineCode($('scCode').value)">Abrir</button></div></details>`}
afterRender.escanear=async()=>{
  const msg=t=>{const e=$('scMsg');if(e)e.textContent=t};
  try{
    if(!navigator.mediaDevices?.getUserMedia)throw Error('Este navegador no permite usar la cámara. En iPhone, usá la app instalada o Safari.');
    await loadScript('./jsqr.js');
    stopScan();SCAN.stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}},audio:false});
    if(S.view!=='escanear')return stopScan();
    const v=$('scVid');v.srcObject=SCAN.stream;await v.play().catch(()=>{});msg('Buscando el código QR…');
    const cv=document.createElement('canvas'),cx=cv.getContext('2d',{willReadFrequently:true});
    const tick=()=>{if(!SCAN.stream||S.view!=='escanear')return stopScan();
      if(v.readyState>=2&&v.videoWidth){const sc=Math.min(1,720/Math.max(v.videoWidth,v.videoHeight));cv.width=Math.round(v.videoWidth*sc);cv.height=Math.round(v.videoHeight*sc);
        cx.drawImage(v,0,0,cv.width,cv.height);const img=cx.getImageData(0,0,cv.width,cv.height);
        const r=window.jsQR(img.data,img.width,img.height,{inversionAttempts:'dontInvert'});
        if(r&&r.data){const code=codeFromQr(r.data);if(code){if(navigator.vibrate)navigator.vibrate(80);stopScan();return openMachineCode(code)}}}
      SCAN.raf=requestAnimationFrame(tick)};
    SCAN.raf=requestAnimationFrame(tick);
  }catch(e){stopScan();msg((e.name==='NotAllowedError'?'No se dio permiso para usar la cámara. En iPhone: Configuración → Safari → Cámara → Permitir (o borrá y volvé a agregar la app). ':'')+(e.message||'No se pudo abrir la cámara.'))}
};

/* Etiqueta individual (para máquinas nuevas o reponer una dañada): PNG de 5 × 5 cm a 300 dpi */
async function machineLabelPng(btn,code){const m=MACHINES.find(x=>x.id===code)||{id:code,name:code,location:''};
  await busy(btn,async()=>{try{await loadScript('./qrcode.js');
    const qr=qrcode(0,'H');qr.addData(qrUrl(code));qr.make();const n=qr.getModuleCount();
    const S5=591,cv=document.createElement('canvas');cv.width=cv.height=S5;const c=cv.getContext('2d');const RED='#b72c37';
    const rr=(x,y,w,h,r)=>{c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()};
    c.fillStyle='#fff';c.fillRect(0,0,S5,S5);rr(9,9,S5-18,S5-18,36);c.fillStyle='#fff';c.fill();c.lineWidth=6;c.strokeStyle=RED;c.stroke();
    c.save();rr(9,9,S5-18,S5-18,36);c.clip();c.fillStyle=RED;c.fillRect(9,9,S5-18,106);c.restore();
    const logo=await new Promise(r=>{const i=new Image();i.onload=()=>r(i);i.onerror=()=>r(null);i.src='./logo-app.png'});
    if(logo){c.fillStyle='#fff';rr(30,23,154,78,14);c.fill();const h=70,w=Math.min(146,logo.width*h/logo.height);c.drawImage(logo,30+(154-w)/2,27,w,h)}
    c.fillStyle='#fff';c.textAlign='right';c.textBaseline='middle';let fs=64;c.font=`bold ${fs}px Helvetica, Arial, sans-serif`;while(c.measureText(code).width>S5-230&&fs>36){fs-=2;c.font=`bold ${fs}px Helvetica, Arial, sans-serif`}c.fillText(code,S5-34,63);
    const q=319,cell=q/n,qx=(S5-q)/2,qy=134;c.fillStyle='#000';
    for(let r=0;r<n;r++)for(let k=0;k<n;k++)if(qr.isDark(r,k))c.fillRect(Math.floor(qx+k*cell),Math.floor(qy+r*cell),Math.ceil(cell),Math.ceil(cell));
    c.textAlign='center';c.textBaseline='alphabetic';c.fillStyle='#000';let ns=40;c.font=`bold ${ns}px Helvetica, Arial, sans-serif`;while(c.measureText(m.name).width>S5-60&&ns>26){ns-=1;c.font=`bold ${ns}px Helvetica, Arial, sans-serif`}c.fillText(m.name,S5/2,500);
    if(m.location&&m.location.toLowerCase()!=='sin ubicación'){c.fillStyle='#555';c.font='28px Helvetica, Arial, sans-serif';c.fillText(m.location,S5/2,540)}
    const blob=await new Promise(r=>cv.toBlob(r,'image/png'));const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`Etiqueta QR ${code}.png`;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),5000);
    toast('Etiqueta descargada: imprimila a 5 × 5 cm','good')}catch(e){toast(e.message,'bad')}})}

async function dailyNow(btn){const m=(h,c='info')=>{const e=$('dMsg');if(e)e.innerHTML=`<div class="${c}">${h}</div>`};
  await busy(btn,async()=>{try{m('Armando el informe y subiéndolo a Drive… (puede tardar un minuto)');
    if(session.expires_at*1000-Date.now()<90000)await refreshToken();

function setRange(k){const d=new Date();let a,b;if(k==='mes'){a=new Date(d.getFullYear(),d.getMonth(),1);b=d}else if(k==='ant'){a=new Date(d.getFullYear(),d.getMonth()-1,1);b=new Date(d.getFullYear(),d.getMonth(),0)}else{a=new Date(d-6*864e5);b=d}

     rows:inv.map(i=>[i.part_code,i.part_name,Number(i.stock_quantity),Number(i.minimum_stock),Number(i.stock_quantity)<=Number(i.minimum_stock)?'REPONER':'OK',i.storage_location||'',partMachText(i)||[i.machine_code,i.machine_name].filter(Boolean).join(' · '),i.unit_cost!=null?{n:Number(i.unit_cost),f:3}:'',i.supplier||''])},
   {name:'Criticidad máquinas',title:'Criticidad de máquinas',sub:'Ponderación: producción 40% · alternativa 25% · frecuencia 13% · inocuidad 12% · impacto económico de insumos 10%. ALTA (A) si hay riesgo de seguridad, inocuidad 5 o puntaje ≥ 3,8; MEDIA (B) ≥ 2,5; BAJA (C) el resto. INCOMPLETO si falta algún criterio. NO FUNCIONA: criticidad nula, con el costo de hacerla funcionar. Las evaluaciones anteriores a la V12.2 conservan su puntaje hasta que se reevalúen.',head:['Código','Máquina','Sector','Criticidad','Clase (A/B/C)','Puntaje','Producción','Alternativa','Frecuencia','Inocuidad','Impacto económico','Riesgo seguridad','No funciona','Repuestos del arreglo','Mano de obra externa','Valor del arreglo','Tareas abiertas','Trabajos en el período','Observaciones','Evaluó','Fecha evaluación'],w:[10,30,14,12,12,10,11,11,11,11,11,10,10,40,24,14,10,12,40,20,16],

function iMsg(html,cls='info'){const e=$('iMsg');if(e)e.innerHTML=`<div class="${cls}">${html}</div>`}
async function reportDownload(btn){await busy(btn,async()=>{try{const r=await buildReport();const a=document.createElement('a');a.href=URL.createObjectURL(r.blob);a.download=r.name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000);iMsg('Excel generado: '+esc(r.summary),'info')}catch(e){iMsg('No se pudo generar: '+esc(e.message),'err')}})}
let gTokenClient=null;
function googleToken(){return new Promise((res,rej)=>{
  if(!window.google?.accounts?.oauth2)return rej(Error('No cargó el servicio de Google. Revisá la conexión y probá de nuevo.'));
  const cached=store.get('mat10_gtoken',null);if(cached&&cached.exp>Date.now()+60000)return res(cached.t);
  gTokenClient=google.accounts.oauth2.initTokenClient({client_id:GOOGLE_CLIENT_ID,scope:'https://www.googleapis.com/auth/drive.file',
    callback:r=>r?.access_token?(store.set('mat10_gtoken',{t:r.access_token,exp:Date.now()+(r.expires_in||3600)*1000}),res(r.access_token)):rej(Error(r?.error_description||r?.error||'Google no autorizó')),
    error_callback:e=>rej(Error(e?.type==='popup_closed'?'Cerraste la ventana de Google antes de autorizar':e?.type==='popup_failed_to_open'?'El navegador bloqueó la ventana de Google. Permití ventanas emergentes.':(e?.message||'Autorización cancelada')))});
  gTokenClient.requestAccessToken({prompt:store.get('mat10_gok',false)?'':'consent'});
})}
async function gfetch(url,token,opt={}){const r=await fetch(url,{...opt,headers:{Authorization:'Bearer '+token,...(opt.headers||{})}});const j=await r.json().catch(()=>({}));
  if(r.status===401){store.del('mat10_gtoken');throw Error('El permiso de Google venció. Tocá de nuevo el botón.')}
  if(!r.ok)throw Error(j?.error?.message||('Google Drive respondió '+r.status));return j}
async function driveFolder(token){
  const saved=store.get('mat10_gfolder',null);
  if(saved){try{const f=await gfetch(`https://www.googleapis.com/drive/v3/files/${saved}?fields=id,trashed`,token);if(!f.trashed)return saved}catch{}}
  const q=encodeURIComponent(`name='${DRIVE_FOLDER}' and mimeType='application/vnd.google-apps.folder' and trashed=false`);
  const l=await gfetch(`https://www.googleapis.com/drive/v3/files?q=${q}&fields=files(id)&spaces=drive`,token);
  let id=l.files?.[0]?.id;
  if(!id)id=(await gfetch('https://www.googleapis.com/drive/v3/files?fields=id',token,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:DRIVE_FOLDER,mimeType:'application/vnd.google-apps.folder'})})).id;
  store.set('mat10_gfolder',id);return id;
}
async function reportToDrive(btn){
  // Pedir el permiso de Google primero (debe ocurrir inmediatamente después del toque, si no Safari bloquea la ventana)
  let token;try{iMsg('Autorizando Google Drive…');token=await googleToken();store.set('mat10_gok',true)}catch(e){return iMsg(esc(e.message),'err')}
  await busy(btn,async()=>{try{
    iMsg('Preparando el Excel…');const r=await buildReport();
    iMsg('Subiendo a Google Drive…');const folder=await driveFolder(token);
    const bnd='mat'+Math.random().toString(36).slice(2),XL='application/vnd.openxmlformats-officedocument.spreadsheetml.sheet';
    const body=new Blob([`--${bnd}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n`+JSON.stringify({name:r.name,parents:[folder],mimeType:XL})+`\r\n--${bnd}\r\nContent-Type: ${XL}\r\n\r\n`,r.blob,`\r\n--${bnd}--`]);
    const f=await gfetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id,name,webViewLink',token,{method:'POST',headers:{'Content-Type':'multipart/related; boundary='+bnd},body});
    iMsg(`✅ Guardado en Drive: <b>${esc(f.name)}</b><br>${esc(r.summary)}<br><a href="${esc(f.webViewLink)}" target="_blank" rel="noopener">Abrir en Google Drive</a>`,'info');
  }catch(e){iMsg('No se guardó en Drive: '+esc(e.message),'err')}});
}
/* Generador de .xlsx sin librerías externas (formato Office Open XML) */
function xlsx(sheets){
  const X=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])).replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g,'');
  const col=n=>{let s='';for(n++;n;n=Math.floor((n-1)/26))s=String.fromCharCode(65+(n-1)%26)+s;return s};
  // estilos: 0 normal,1 título,2 subtítulo,3 encabezado,4 celda,5 celda 0.00,6 celda $,7 celda alternada,8 alt 0.00,9 alt $
  const cell=(r,c,v,alt)=>{const ref=col(c)+r;if(v&&typeof v==='object'&&v.link){const u=String(v.link).replace(/"/g,'""'),t=String(v.text).replace(/"/g,'""');return `<c r="${ref}" s="${alt?11:10}" t="str"><f>${X(`HYPERLINK("${u}","${t}")`)}</f><v>${X(v.text)}</v></c>`}
    if(v&&typeof v==='object'){const s=v.f===3?(alt?9:6):(alt?8:5);return `<c r="${ref}" s="${s}"><v>${Number.isFinite(v.n)?v.n:0}</v></c>`}
    if(typeof v==='number'&&Number.isFinite(v))return `<c r="${ref}" s="${alt?7:4}"><v>${v}</v></c>`;return `<c r="${ref}" s="${alt?7:4}" t="inlineStr"><is><t xml:space="preserve">${X(v)}</t></is></c>`};
  const sheetXml=sh=>{const n=sh.head.length,last=col(n-1),end=3+sh.rows.length;
    let rows=`<row r="1" ht="26" customHeight="1"><c r="A1" s="1" t="inlineStr"><is><t>${X(sh.title)}</t></is></c></row><row r="2"><c r="A2" s="2" t="inlineStr"><is><t>${X(sh.sub)}</t></is></c></row>`;
    rows+=`<row r="3" ht="22" customHeight="1">${sh.head.map((h,i)=>`<c r="${col(i)}3" s="3" t="inlineStr"><is><t>${X(h)}</t></is></c>`).join('')}</row>`;
    sh.rows.forEach((r,i)=>{rows+=`<row r="${i+4}">${r.map((v,j)=>cell(i+4,j,v,i%2===1)).join('')}</row>`});
    return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheetViews><sheetView workbookViewId="0" showGridLines="0"><pane ySplit="3" topLeftCell="A4" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews><cols>${sh.w.map((w,i)=>`<col min="${i+1}" max="${i+1}" width="${w}" customWidth="1"/>`).join('')}</cols><sheetData>${rows}</sheetData>${sh.rows.length?`<autoFilter ref="A3:${last}${end}"/>`:''}<mergeCells count="2"><mergeCell ref="A1:${n>1?last:'B'}1"/><mergeCell ref="A2:${n>1?last:'B'}2"/></mergeCells><pageSetup orientation="landscape" fitToWidth="1" fitToHeight="0"/></worksheet>`};
  const b='<border><left style="thin"><color rgb="FFDDDDDD"/></left><right style="thin"><color rgb="FFDDDDDD"/></right><top style="thin"><color rgb="FFDDDDDD"/></top><bottom style="thin"><color rgb="FFDDDDDD"/></bottom></border>';

rId="1" applyNumberFormat="1" applyFill="1" applyBorder="1"><alignment vertical="top"/></xf><xf fontId="4" borderId="1" applyFont="1" applyBorder="1"><alignment vertical="top"/></xf><xf fontId="4" fillId="4" borderId="1" applyFont="1" applyFill="1" applyBorder="1"><alignment vertical="top"/></xf></cellXfs></styleSheet>`;
  const files=[['[Content_Types].xml',`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>${sheets.map((_,i)=>`<Override PartName="/xl/worksheets/sheet${i+1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`).join('')}</Types>`],
    ['_rels/.rels','<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>'],

    ['xl/_rels/workbook.xml.rels',`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">${sheets.map((_,i)=>`<Relationship Id="rId${i+1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${i+1}.xml"/>`).join('')}<Relationship Id="rId${sheets.length+1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>`],
    ['xl/styles.xml',styles],...sheets.map((s,i)=>[`xl/worksheets/sheet${i+1}.xml`,sheetXml(s)])];
  return zip(files,'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet');
}
function zip(entries,type){const enc=new TextEncoder(),out=[],central=[];let off=0;
  const T=zip.t||(zip.t=Array.from({length:256},(_,n)=>{for(let i=0;i<8;i++)n=n&1?0xedb88320^(n>>>1):n>>>1;return n>>>0}));
  const crc=b=>{let c=~0;for(const x of b)c=T[(c^x)&255]^(c>>>8);return(~c)>>>0};
  for(const [name,content] of entries){const nb=enc.encode(name),d=enc.encode(content),c=crc(d);
    const l=new DataView(new ArrayBuffer(30));l.setUint32(0,0x04034b50,true);l.setUint16(4,20,true);l.setUint16(6,0x0800,true);l.setUint32(14,c,true);l.setUint32(18,d.length,true);l.setUint32(22,d.length,true);l.setUint16(26,nb.length,true);
    out.push(l.buffer,nb,d);
    const h=new DataView(new ArrayBuffer(46));h.setUint32(0,0x02014b50,true);h.setUint16(4,20,true);h.setUint16(6,20,true);h.setUint16(8,0x0800,true);h.setUint32(16,c,true);h.setUint32(20,d.length,true);h.setUint32(24,d.length,true);h.setUint16(28,nb.length,true);h.setUint32(42,off,true);
    central.push(h.buffer,nb);off+=30+nb.length+d.length}
  const cs=central.reduce((s,b)=>s+(b.byteLength),0),e=new DataView(new ArrayBuffer(22));e.setUint32(0,0x06054b50,true);e.setUint16(8,entries.length,true);e.setUint16(10,entries.length,true);e.setUint32(12,cs,true);e.setUint32(16,off,true);
  return new Blob([...out,...central,e.buffer],{type});
}

/* ===================== INSTALACIÓN (Android / iPhone) ===================== */
let installEvt=null;
const isStandalone=()=>matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
const isIOS=()=>/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
const isAndroid=()=>/android/i.test(navigator.userAgent);
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installEvt=e;if(['login','mas','ayuda'].includes(S.view))render()});
window.addEventListener('appinstalled',()=>{installEvt=null;toast('App instalada. Abrila desde el ícono de Facilitas.','good');render()});
function installBox(){if(isStandalone())return '';
  if(installEvt)return `<button class="btn yel block" onclick="doInstall()">📲 Instalar la app en este celular</button>`;
  if(isIOS())return `<div class="info" style="margin-top:12px">📲 Para instalarla: en <b>Safari</b> tocá <b>Compartir</b> → <b>Agregar a pantalla de inicio</b>.</div>`;
  if(isAndroid())return `<div class="info" style="margin-top:12px">📲 Para instalarla: en <b>Chrome</b> tocá los <b>tres puntos ⋮</b> → <b>Instalar aplicación</b> (o "Agregar a pantalla principal").</div>`;
  return ''}
async function doInstall(){if(!installEvt)return;installEvt.prompt();const r=await installEvt.userChoice.catch(()=>null);installEvt=null;if(r?.outcome!=='accepted')toast('Podés instalarla más tarde desde Más','');render()}

/* ===================== ARRANQUE ===================== */
async function start(){
  if(!session){go('login');return}
  try{if(session.expires_at*1000-Date.now()<90000&&!(await refreshToken()))return go('login');
    await loadMe();
    if(!S.me){toast('No se encontró tu perfil. Avisale al supervisor.','bad');return go('login')}
    const meta=store.get('mat10_pending_meta',null);
    if(meta&&!S.me.first_name){try{await api('/rest/v1/profiles?id=eq.'+myId(),{method:'PATCH',body:meta});await loadMe()}catch{}}
    if(S.me.first_name)store.del('mat10_pending_meta');
    if(S.me.approved!==true)return go('pending');
    S.view=['login','signup','pending','recovery'].includes(S.view)?'inicio':S.view;render();await refresh();
    {const pm=store.get('mat12_go_mach',null);if(pm){store.del('mat12_go_mach');openMachineCode(pm)}}
    syncPush().then(()=>{if(['inicio','perfil'].includes(S.view))render()});
  }catch(e){if(!session)return go('login');$('app').innerHTML=`<div class="card"><h3>Sin conexión</h3><p class="muted">${esc(e.message)}</p><button class="btn block" onclick="start()">Reintentar</button></div>`}
}
(function init(){
  const qm=new URLSearchParams(location.search).get('m');if(qm){const c=qm.toUpperCase().replace(/[^A-Z0-9-]/g,'');store.set('mat12_go_mach',c);S.view='maquina';S.mach=c;history.replaceState(null,'',location.pathname)}
  const qv=new URLSearchParams(location.search).get('v');if(qv&&['tareas','pedidos','inicio','avisos','preventivo'].includes(qv)){S.view=qv;history.replaceState(null,'',location.pathname)}
  if('serviceWorker' in navigator)navigator.serviceWorker.addEventListener('message',e=>{if(e.data?.type==='abrir'&&session&&S.me?.approved){refresh();if(e.data.view)go(e.data.view)}});
  const h=new URLSearchParams(location.hash.slice(1));
  if(h.get('access_token')){saveSession({access_token:h.get('access_token'),refresh_token:h.get('refresh_token'),expires_in:Number(h.get('expires_in')||3600),user:null});
    history.replaceState(null,'',location.pathname);
    raw('/auth/v1/user').then(u=>{session.user=u;saveSession(session);if(h.get('type')==='recovery'){S.view='recovery';render()}else start()}).catch(()=>{toast('El enlace venció. Pedí uno nuevo.','bad');logout()});return}
  if(h.get('error_description')){history.replaceState(null,'',location.pathname);toast(h.get('error_description'),'bad')}
  start();
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&session&&S.me?.approved)refresh()});
  setInterval(()=>{if(document.visibilityState==='visible'&&session&&S.me?.approved&&['inicio','tareas'].includes(S.view))refresh()},120000);
  if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
})();
</script>

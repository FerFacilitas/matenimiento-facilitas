async function loadMe(){const r=await api('/rest/v1/profiles?id=eq.'+myId()+'&select=*');S.me=r[0]||null;return S.me}
async function refresh(manual){
  if(!session)return;
  const b=$('syncBtn');if(manual)b.textContent='↻ …';
  try{
    const [profiles,tasks,parts,inv,moves]=await Promise.all([
      api('/rest/v1/profiles?select=id,first_name,last_name,specialty,role,approved,shift_start,shift_end&order=first_name.asc'),
      api('/rest/v1/work_tasks?select=*&order=created_at.desc&limit=400'),
      api('/rest/v1/shift_parts?select=*&order=created_at.desc&limit=150'),
      api('/rest/v1/spare_parts_inventory?select=*&order=part_code.asc&limit=2000'),
      api('/rest/v1/spare_parts_movements?select=*&order=created_at.desc&limit=300')]);
    Object.assign(S,{profiles,tasks,parts,inv,moves,loaded:true});
    try{const cr=await api('/rest/v1/machine_criticality?select=*');S.crit=Object.fromEntries(cr.map(r=>[r.machine_code,r]));S.critMissing=false}
    catch(e){S.critMissing=true}
    try{const [h,r]=await Promise.all([api('/rest/v1/work_task_helpers?select=*&order=created_at.asc&limit=3000'),api('/rest/v1/part_requests?select=*&order=created_at.desc&limit=300')]);S.helpers=h;S.reqs=r;S.v11Missing=false}
    catch(e){S.v11Missing=true}
    S.me=profiles.find(p=>p.id===myId())||S.me;
    if(manual)toast('Datos actualizados','good');
    if(['inicio','tareas','maquinas','usuarios','pedidos'].includes(S.view)||manual)render();
  }catch(e){toast('No se pudo actualizar: '+e.message,'bad')}
  finally{b.textContent='↻ Actualizar'}
}

/* ===================== NAVEGACIÓN ===================== */
function go(v,opts){S.view=v;Object.assign(S,opts||{});render();window.scrollTo(0,0)}
function render(){
  const logged=!!(session&&S.me&&S.me.approved===true);
  $('nav').classList.toggle('hidden',!logged);$('syncBtn').classList.toggle('hidden',!logged);
  $('who').textContent=logged?(nameOf(myId())+' · '+({supervisor:'Supervisor',jefe:'Jefe de mantenimiento',operario:'Operario'}[role()]||role())):'Mundo Facilitas';
  document.querySelectorAll('nav.bottom button').forEach(b=>b.classList.toggle('on',b.dataset.v===S.view||(b.dataset.v==='mas'&&['perfil','asignar','usuarios','informes','ayuda','maquinas','maquina'].includes(S.view))||(b.dataset.v==='tareas'&&S.view==='emergencia')||(b.dataset.v==='repuestos'&&S.view==='pedidos')));
  const V={login:vLogin,signup:vSignup,pending:vPending,recovery:vRecovery,inicio:vInicio,tareas:vTareas,registrar:vRegistrar,repuestos:vRepuestos,mas:vMas,perfil:vPerfil,asignar:vAsignar,usuarios:vUsuarios,informes:vInformes,ayuda:vAyuda,maquinas:vMaquinas,maquina:vMaquina,emergencia:vEmergencia,pedidos:vPedidos};
  if(!logged&&!['login','signup','pending','recovery','ayuda'].includes(S.view))S.view='login';
  $('app').innerHTML=(V[S.view]||vInicio)();
  afterRender[S.view]?.();
}
const afterRender={};

/* ===================== INGRESO ===================== */
function vLogin(){return `<div class="login-wrap"><img class="login-logo" src="./logo-facilitas.jpg" alt="Facilitas">
<div class="card"><h3>Ingresar</h3>
<label>Correo electrónico</label><input id="lEmail" type="email" autocomplete="username" inputmode="email" value="${esc(store.get('mat10_last_email',''))}">
<label>Contraseña</label><input id="lPass" type="password" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin($('lBtn'))">
<label class="small" style="font-weight:400"><input type="checkbox" id="lShow" style="width:auto" onchange="$('lPass').type=this.checked?'text':'password'"> Mostrar contraseña</label>
<button class="btn block" id="lBtn" onclick="doLogin(this)">Ingresar</button>
<div class="actions"><button class="btn ghost sm" onclick="doForgot(this)">Olvidé mi contraseña</button><button class="btn sec sm" onclick="go('signup')">Crear cuenta</button></div></div>
${installBox()}<p class="muted small" style="text-align:center">Matenimiento Facilitas ${VERSION} · <a href="#" onclick="go('ayuda');return false">Cómo instalar en el celular</a></p></div>`}
async function doLogin(btn){
  const email=$('lEmail').value.trim(),password=$('lPass').value;
  if(!email||!password)return toast('Completá correo y contraseña','bad');
  await busy(btn,async()=>{try{
    const s=await raw('/auth/v1/token?grant_type=password',{method:'POST',auth:false,body:{email,password}});
    saveSession(s);store.set('mat10_last_email',email);await start();
  }catch(e){toast(/invalid/i.test(e.message)?'Correo o contraseña incorrectos':e.message,'bad')}});
}
async function doForgot(btn){
  const email=$('lEmail').value.trim();if(!email)return toast('Escribí tu correo arriba y tocá de nuevo','bad');
  await busy(btn,async()=>{try{await raw('/auth/v1/recover?redirect_to='+encodeURIComponent(location.origin+location.pathname),{method:'POST',auth:false,body:{email}});toast('Si el correo está registrado, te llegará un enlace para cambiar la contraseña','good')}catch(e){toast(e.message,'bad')}});
}
function vSignup(){return `<div class="login-wrap"><h2>Crear cuenta</h2><div class="card">
<div class="row"><div><label>Nombre</label><input id="rFirst" autocomplete="given-name"></div><div><label>Apellido</label><input id="rLast" autocomplete="family-name"></div></div>
<label>Correo electrónico</label><input id="rEmail" type="email" inputmode="email" autocomplete="email">
<label>Contraseña (mínimo 8 caracteres)</label><input id="rPass" type="password" autocomplete="new-password">
<label>Especialidad</label><select id="rSpec">${SPECIALTIES.slice(0,3).map(s=>`<option>${s}</option>`).join('')}</select>
<div class="row"><div><label>Entrada</label><input id="rStart" type="time"></div><div><label>Salida</label><input id="rEnd" type="time"></div></div>
<button class="btn block" onclick="doSignup(this)">Solicitar registro</button>
<p class="muted small">Tu cuenta queda pendiente hasta que el supervisor la apruebe.</p></div>
<button class="btn ghost block" onclick="go('login')">← Volver</button></div>`}
async function doSignup(btn){
  const d={first:$('rFirst').value.trim(),last:$('rLast').value.trim(),email:$('rEmail').value.trim(),pass:$('rPass').value};
  if(!d.first||!d.last||!d.email)return toast('Completá nombre, apellido y correo','bad');
  if(d.pass.length<8)return toast('La contraseña debe tener al menos 8 caracteres','bad');
  const meta={first_name:d.first,last_name:d.last,specialty:$('rSpec').value,shift_start:$('rStart').value||null,shift_end:$('rEnd').value||null};
  await busy(btn,async()=>{try{
    const r=await raw('/auth/v1/signup',{method:'POST',auth:false,body:{email:d.email,password:d.pass,data:meta}});
    store.set('mat10_last_email',d.email);store.set('mat10_pending_meta',meta);
    if(r?.access_token){saveSession(r);await start()}else{toast('Registro enviado. Si te llega un correo de confirmación, abrilo y después ingresá.','good');go('login')}
  }catch(e){toast(/registered|exists/i.test(e.message)?'Ese correo ya está registrado. Ingresá o recuperá la contraseña.':e.message,'bad')}});
}
function vPending(){const p=S.me||{};const incomplete=!p.first_name||!p.last_name;return `<div class="login-wrap"><img class="login-logo" src="./logo-facilitas.jpg" alt="">
<div class="card accent"><h3>Cuenta pendiente de aprobación</h3><p class="muted">Ya estás registrado. Avisale al supervisor para que apruebe tu cuenta. Después tocá "Ya me aprobaron".</p>
${incomplete?`<div class="note">Completá tus datos para que puedan aprobarte:</div>
<div class="row"><div><label>Nombre</label><input id="pFirst" value="${esc(p.first_name||'')}"></div><div><label>Apellido</label><input id="pLast" value="${esc(p.last_name||'')}"></div></div>
<label>Especialidad</label><select id="pSpec">${SPECIALTIES.slice(0,3).map(s=>`<option ${p.specialty===s?'selected':''}>${s}</option>`).join('')}</select>
<button class="btn block" onclick="savePendingProfile(this)">Guardar mis datos</button>`:`<p><b>${esc(p.first_name+' '+p.last_name)}</b> · ${esc(p.specialty||'')}</p>`}
<button class="btn sec block" onclick="start()">Ya me aprobaron</button><button class="btn ghost block" onclick="logout()">Salir</button></div></div>`}

  await busy(btn,async()=>{try{await api('/rest/v1/profiles?id=eq.'+myId(),{method:'PATCH',body:{first_name,last_name,specialty:$('pSpec').value}});await loadMe();toast('Datos guardados','good');render()}catch(e){toast(e.message,'bad')}})}
function vRecovery(){return `<div class="login-wrap"><div class="card"><h3>Nueva contraseña</h3><label>Escribí tu nueva contraseña (mínimo 8)</label><input id="nPass" type="password" autocomplete="new-password"><button class="btn block" onclick="doRecovery(this)">Guardar contraseña</button></div></div>`}
async function doRecovery(btn){const p=$('nPass').value;if(p.length<8)return toast('Mínimo 8 caracteres','bad');
  await busy(btn,async()=>{try{await api('/auth/v1/user',{method:'PUT',body:{password:p}});toast('Contraseña cambiada','good');await start()}catch(e){toast('El enlace venció. Pedí uno nuevo. ('+e.message+')','bad')}})}
async function logout(){await unlinkPush();saveSession(null);S.pushOn=null;S.me=null;S.loaded=false;go('login')}

/* ===================== INICIO ===================== */

  const mine=S.tasks.filter(isMine);
  const pend=mine.filter(t=>t.status==='pendiente').length,proc=mine.filter(t=>t.status==='en_proceso').length;
  const urg=S.tasks.filter(t=>t.status!=='terminado'&&t.priority==='urgente').length;
  const low=S.inv.filter(i=>Number(i.stock_quantity)<=Number(i.minimum_stock)).length;
  const reqOpen=S.reqs.filter(r=>r.status==='pendiente').length;
  let news=S.parts;if(S.newsFilter==='pend')news=news.filter(p=>p.status!=='terminado'||p.handover_notes);
  return `<h2>Hola, ${esc(S.me.first_name||'')} 👋</h2>
${S.v11Missing&&isSup()?`<div class="err" style="margin-bottom:12px">Falta instalar el SQL de la V11 en Supabase (compañeros, emergencias, pedidos y avisos).</div>`:''}
${pushBanner()}
<div class="stats">
 <div class="stat red" onclick="go('tareas',{taskFilter:'mias',taskStatus:'activas'})"><b>${pend}</b><span>Mis tareas pendientes</span></div>
 <div class="stat" onclick="go('tareas',{taskFilter:'mias',taskStatus:'activas'})"><b>${proc}</b><span>Mis tareas en proceso</span></div>
 <div class="stat ${urg?'yel':''}" onclick="go('tareas',{taskFilter:'todas',taskStatus:'activas'})"><b>${urg}</b><span>Urgentes abiertas (equipo)</span></div>
 <div class="stat ${low?'yel':''}" onclick="go('repuestos',{invLow:true})"><b>${low}</b><span>Repuestos bajo mínimo</span></div>
${isBoss()?`<div class="stat ${reqOpen?'yel':''}" onclick="go('pedidos',{reqF:'abiertos'})"><b>${reqOpen}</b><span>Pedidos de repuestos/insumos sin pedir</span></div>`:''}
<div class="stat" style="background:#fde4e1;border-color:#f5b5ad" onclick="go('emergencia')"><b style="color:#b42318">🚨</b><span><b style="font-size:13px;display:inline;color:#b42318">Cargar emergencia</b></span></div>
</div>
${(()=>{const hi=MACHINES.filter(m=>critOf(m.id)?.level==='ALTA');const ev=MACHINES.filter(m=>critOf(m.id)).length;
  return `<div class="card accent" style="cursor:pointer" onclick="go('maquinas',{critF:'ALTA'})"><div class="line"><div><div class="title">🏭 Máquinas de criticidad ALTA: ${hi.length}</div><div class="muted small">${ev} de ${MACHINES.length} evaluadas · tocá para ver</div></div><span class="muted">›</span></div></div>`})()}
<h2>Novedades de turno</h2>
<div class="seg"><button class="${S.newsFilter==='todo'?'on':''}" onclick="S.newsFilter='todo';render()">Todo</button><button class="${S.newsFilter==='pend'?'on':''}" onclick="S.newsFilter='pend';render()">Pendientes y avisos</button></div>
${news.slice(0,60).map(partCard).join('')||'<div class="card muted">Todavía no hay novedades registradas.</div>'}`;
}
function partCard(p){return `<div class="card ${p.status==='pendiente'?'alta':p.status==='cierre'?'':'accent'}">
<div class="line"><div><div class="title">${esc(p.machine_label||'Cierre de turno')}</div><div class="muted small">${esc(nameOf(p.user_id))} · ${fmtDT(p.created_at)}</div></div>${badge(STATUS,p.status)}</div>
${p.status!=='cierre'||p.description!=='Cierre de turno'?`<p style="margin:8px 0 0;white-space:pre-wrap">${esc(p.description)}</p>`:''}
${p.spare_parts?`<p class="muted small" style="margin:6px 0 0">🔩 ${esc(p.spare_parts)}</p>`:''}
${p.photo_urls?.length?`<div class="thumbs">${p.photo_urls.map(u=>`<a href="${esc(u)}" target="_blank" rel="noopener"><img src="${esc(u)}" loading="lazy" alt="Foto"></a>`).join('')}</div>`:''}
${p.handover_notes?`<div class="note">➡️ Para el siguiente turno: ${esc(p.handover_notes)}</div>`:''}</div>`}

/* ===================== TAREAS ===================== */
function vTareas(){
  let list=S.tasks;if(S.taskFilter==='mias')list=list.filter(isMine);
  if(S.taskStatus==='activas')list=list.filter(t=>t.status!=='terminado');else list=list.filter(t=>t.status==='terminado');
  const order={urgente:0,alta:1,normal:2};
  if(S.taskStatus==='activas')list=[...list].sort((a,b)=>(a.status==='en_proceso'?-1:0)-(b.status==='en_proceso'?-1:0)||order[a.priority]-order[b.priority]||String(a.due_date||'9').localeCompare(String(b.due_date||'9')));
  return `<h2>Tareas</h2>
<div class="seg"><button class="${S.taskFilter==='mias'?'on':''}" onclick="S.taskFilter='mias';render()">Mis tareas</button><button class="${S.taskFilter==='todas'?'on':''}" onclick="S.taskFilter='todas';render()">Todo el equipo</button></div>
<div class="seg"><button class="${S.taskStatus==='activas'?'on':''}" onclick="S.taskStatus='activas';render()">Pendientes y en proceso</button><button class="${S.taskStatus==='hechas'?'on':''}" onclick="S.taskStatus='hechas';render()">Terminadas</button></div>
<div class="row" style="margin:0 0 12px">${isBoss()?`<button class="btn sec" onclick="go('asignar')">＋ Asignar tarea</button>`:''}<button class="btn em" onclick="go('emergencia')">🚨 Cargar emergencia</button></div>
${list.slice(0,150).map(taskCard).join('')||'<div class="card muted">No hay tareas en esta lista.</div>'}`;
}
function taskCard(t){
  const own=t.assigned_to===myId(),helper=isHelper(t),paused=!!t.paused_at,overdue=t.due_date&&t.status!=='terminado'&&t.due_date<today();
  const canHelp=own||isBoss(),hs=helpersOf(t.id);
  let btns='';
  if(own){if(t.status==='pendiente')btns=`<button class="btn sm" onclick="taskAct(this,'${t.id}','iniciar')">▶ Iniciar</button>`;
    else if(t.status==='en_proceso')btns=paused?`<button class="btn sm" onclick="taskAct(this,'${t.id}','reanudar')">▶ Reanudar</button>`:`<button class="btn ghost sm" onclick="taskAct(this,'${t.id}','pausar')">⏸ Pausar</button><button class="btn ok sm" onclick="taskAct(this,'${t.id}','finalizar')">✓ Finalizar</button>`;
    if(t.status!=='pendiente')btns+=`<button class="btn sec sm" onclick="startDraftFromTask('${t.id}')">📝 Registrar trabajo</button>`}
  else if(helper&&t.status!=='pendiente')btns=`<button class="btn sec sm" onclick="startDraftFromTask('${t.id}')">📝 Registrar trabajo</button>`;
  const free=S.profiles.filter(p=>p.approved&&p.first_name&&p.id!==t.assigned_to&&!hs.includes(p.id));
  const helpBox=canHelp&&!S.v11Missing&&free.length?`<details style="margin-top:8px"><summary>👥 Sumar compañero que ayudó</summary><div class="row" style="margin-top:8px"><select id="hp_${t.id}"><option value="">Elegí compañero…</option>${free.map(p=>`<option value="${p.id}">${esc(p.first_name+' '+(p.last_name||''))}</option>`).join('')}</select><button class="btn sm" style="flex:0 0 auto" onclick="addHelper(this,'${t.id}')">Sumar</button></div></details>`:'';
  return `<div class="card ${t.priority==='urgente'?'urgent':t.priority==='alta'?'alta':'accent'}">
<div class="line"><div>${t.is_emergency?'<span class="badge b-em">🚨 EMERGENCIA</span> ':''}<div class="title">${esc(t.description)}</div><div class="muted small">${esc(t.machine_label||'Sin equipo')} ${critBadge((t.machine_label||'').split(' · ')[0],true)}</div></div><div style="text-align:right">${badge(STATUS,t.status)}<br>${t.priority!=='normal'?badge(PRIO,t.priority):''}</div></div>
<div class="muted small" style="margin-top:6px">👤 ${esc(nameOf(t.assigned_to))}${t.is_emergency?' · cargada por el operario':' · asignó '+esc(nameOf(t.assigned_by))}${t.due_date?` · <span style="${overdue?'color:#b42318;font-weight:700':''}">límite ${fmtD(t.due_date)}${overdue?' (vencida)':''}</span>`:''}</div>
${t.started_at?`<div class="muted small">⏱ ${hhmm(taskSeconds(t))} efectivos${paused?' · <b>en pausa</b>':''}${t.finished_at?' · terminó '+fmtDT(t.finished_at):''}</div>`:''}
${hs.length?`<div class="helpers">👥 Con: ${hs.map(u=>`${esc(nameOf(u))}${canHelp?`<button class="x" onclick="removeHelper(this,'${t.id}','${u}')" aria-label="Quitar">×</button>`:''}`).join(', ')}${helper?' <b>(vos ayudás en esta)</b>':''}</div>`:''}
${btns?`<div class="actions">${btns}</div>`:''}${helpBox}</div>`}
async function addHelper(btn,id){const u=$('hp_'+id)?.value;if(!u)return toast('Elegí el compañero','bad');
  await busy(btn,async()=>{try{await rpc('add_task_helper',{p_task_id:id,p_user_id:u});S.helpers.push({task_id:id,user_id:u,added_by:myId()});toast(nameOf(u)+' sumado a la tarea','good');render()}catch(e){toast(e.message,'bad')}})}
async function removeHelper(btn,id,u){if(!confirm('¿Quitar a '+nameOf(u)+' de esta tarea?'))return;
  await busy(btn,async()=>{try{await rpc('remove_task_helper',{p_task_id:id,p_user_id:u});S.helpers=S.helpers.filter(h=>!(h.task_id===id&&h.user_id===u));render()}catch(e){toast(e.message,'bad')}})}

/* ===================== EMERGENCIAS ===================== */
let E={machine:'',other:'',desc:'',helpers:[],finished:false};
function vEmergencia(){const ops=S.profiles.filter(p=>p.approved&&p.first_name&&p.id!==myId());
  return `<button class="btn ghost sm" onclick="go('tareas')">← Tareas</button><h2>🚨 Cargar emergencia</h2>
<div class="card urgent"><p class="muted small" style="margin-top:0">Para fallas que hubo que atender sin que nadie te asignara la tarea. Al guardar le llega un aviso al supervisor.</p>

<div id="eOtherBox" class="${E.machine==='__other'?'':'hidden'}"><label>¿Cuál?</label><input value="${esc(E.other)}" oninput="E.other=this.value" placeholder="Ej: Tablero eléctrico, portón…"></div>
<label>Qué pasó y qué se hizo</label><textarea oninput="E.desc=this.value" placeholder="Ej: Se cortó la correa de la amasadora, se cambió y quedó funcionando">${esc(E.desc)}</textarea>

<div>${ops.map(p=>`<label class="chk"><input type="checkbox" ${E.helpers.includes(p.id)?'checked':''} onchange="E.helpers=this.checked?[...E.helpers,'${p.id}']:E.helpers.filter(x=>x!=='${p.id}')">${esc(p.first_name+' '+(p.last_name||''))} <span class="muted small">${esc(p.specialty||'')}</span></label>`).join('')||'<p class="muted small">No hay otros usuarios.</p>'}</div>
<label>Estado</label><div class="seg" style="margin:0"><button class="${!E.finished?'on':''}" onclick="E.finished=false;render()">La estoy atendiendo</button><button class="${E.finished?'on':''}" onclick="E.finished=true;render()">Ya está resuelta</button></div>
<p class="muted small">${E.finished?'Queda como terminada. Después podés registrar el trabajo con fotos y repuestos.':'Arranca el reloj. Cuando termines, tocá Finalizar en la tarea.'}</p>
<button class="btn em block" onclick="saveEmergency(this)">🚨 Guardar emergencia y avisar</button></div>`}
async function saveEmergency(btn){const label=E.machine==='__other'?E.other.trim():E.machine,desc=E.desc.trim();
  if(!label)return toast('Elegí el equipo','bad');if(!desc)return toast('Contá qué pasó','bad');
  await busy(btn,async()=>{try{const id=await rpc('create_emergency_task',{p_machine_label:label,p_description:desc,p_helpers:E.helpers,p_finished:E.finished});
    const fin=E.finished;E={machine:'',other:'',desc:'',helpers:[],finished:false};toast('Emergencia guardada. Se avisó al supervisor.','good');await refresh();
    if(fin&&id&&confirm('¿Registrar ahora el trabajo con fotos y repuestos usados?'))return startDraftFromTask(id);
    go('tareas',{taskFilter:'mias',taskStatus:fin?'hechas':'activas'})}
  catch(e){toast(/create_emergency_task|schema cache/i.test(e.message)?'Falta instalar el SQL de la V11 en Supabase.':e.message,'bad')}})}
async function taskAct(btn,id,action){
  const labels={iniciar:'Iniciar',pausar:'Pausar',reanudar:'Reanudar',finalizar:'Finalizar'};
  if(action==='finalizar'&&!confirm('¿Finalizar este trabajo? Después podés registrar el detalle y los repuestos usados.'))return;
  await busy(btn,async()=>{try{const r=await rpc('maintenance_task_action',{p_task_id:id,p_action:action});
    const i=S.tasks.findIndex(t=>t.id===id);if(i>=0&&r)S.tasks[i]=Array.isArray(r)?r[0]:r;toast(labels[action]+': listo','good');
    if(action==='finalizar'&&confirm('¿Querés registrar ahora el trabajo realizado y los repuestos usados?'))return startDraftFromTask(id);render()}

/* Fotos: se achican en el celular (máx. 1600 px) y se suben a Supabase Storage */
function loadImg(file){return new Promise((res,rej)=>{const u=URL.createObjectURL(file),i=new Image();i.onload=()=>res(i);i.onerror=()=>{URL.revokeObjectURL(u);rej(Error('No se pudo leer la foto'))};i.src=u})}
async function shrinkPhoto(file){const img=await loadImg(file);const k=Math.min(1,1600/Math.max(img.naturalWidth,img.naturalHeight));
  const c=document.createElement('canvas');c.width=Math.round(img.naturalWidth*k);c.height=Math.round(img.naturalHeight*k);c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(img.src);
  return new Promise(r=>c.toBlob(b=>r(b||file),'image/jpeg',0.8))}
const uid=()=>crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2);
async function uploadPhoto(blob){if(session.expires_at*1000-Date.now()<90000)await refreshToken();
  const path=`${myId()}/${today()}/${uid()}.jpg`;
  const r=await fetch(`${SB_URL}/storage/v1/object/${PHOTO_BUCKET}/${path}`,{method:'POST',headers:{apikey:SB_KEY,Authorization:'Bearer '+session.access_token,'Content-Type':'image/jpeg','x-upsert':'false'},body:blob});
  if(!r.ok){const j=await r.json().catch(()=>({}));throw Error(/bucket/i.test(j.message||'')?'Falta instalar el SQL de la V11 (carpeta de fotos).':(j.message||j.error||('Error '+r.status)))}
  return `${SB_URL}/storage/v1/object/public/${PHOTO_BUCKET}/${path}`}
async function addPhotos(input){const files=[...input.files].slice(0,MAX_PHOTOS-D.photos.length);input.value='';if(!files.length)return;
  const b=$('phBtn');if(b)b.innerHTML='<span class="spin" style="border-color:#bbb;border-top-color:#333"></span> Subiendo foto…';
  let ok=0;for(const f of files){try{D.photos.push(await uploadPhoto(await shrinkPhoto(f)));saveDraft();ok++}catch(e){toast('Foto no subida: '+e.message,'bad')}}
  if(ok)toast(ok===1?'Foto agregada':ok+' fotos agregadas','good');if(S.view==='registrar')render()}
async function saveWork(btn){
  const label=draftLabel(),desc=D.desc.trim();
  if(!label)return toast('Elegí el equipo','bad');if(!desc)return toast('Describí el trabajo realizado','bad');
  const parts=D.parts.filter(p=>p.id);
  for(const p of parts){const q=Number(p.qty),it=S.inv.find(i=>i.id===p.id);
    if(!Number.isInteger(q)||q<=0)return toast('Revisá las cantidades de repuestos','bad');
    const total=parts.filter(x=>x.id===p.id).reduce((s,x)=>s+Number(x.qty),0);
    if(it&&total>Number(it.stock_quantity))return toast(`No hay stock suficiente de ${it.part_name} (hay ${it.stock_quantity})`,'bad')}
  const m=MACHINES.find(x=>machineLabel(x)===label);
  const partsText=parts.map(p=>{const it=S.inv.find(i=>i.id===p.id);return `${it?.part_code||''} ${it?.part_name||''} x${p.qty}`.trim()}).join('; ');
  await busy(btn,async()=>{
    const body={user_id:myId(),machine_label:label,description:desc,status:D.status,spare_parts:partsText,handover_notes:D.next.trim()};
    if(!S.v11Missing){body.photo_urls=D.photos;body.work_task_id=D.taskId||null}
    try{await api('/rest/v1/shift_parts',{method:'POST',prefer:'return=minimal',body})}
    catch(e){return toast('No se guardó el trabajo: '+e.message,'bad')}
    const fails=[];
    for(const p of parts){const it=S.inv.find(i=>i.id===p.id);
      try{await rpc('register_spare_part_movement',{p_part_id:p.id,p_movement_type:'retiro',p_quantity:Number(p.qty),p_machine_code:m?.id||null,p_machine_name:m?.name||label,p_work_task_id:D.taskId||null,p_unit_cost:null,p_notes:'Trabajo: '+desc.slice(0,120),p_original_movement_id:null})}
      catch(e){fails.push((it?.part_name||'repuesto')+': '+e.message)}}
    D=emptyDraft();saveDraft();
    if(fails.length)alert('El trabajo se guardó, pero NO se descontaron estos repuestos:\n\n'+fails.join('\n')+'\n\nRegistralos desde Repuestos o avisá al jefe.');
    else toast(parts.length?'Trabajo guardado y repuestos descontados':'Trabajo guardado','good');
    await refresh();go('inicio');
  });
}

async function saveRequest(btn){const it=S.inv.find(i=>i.id===PQ.part),qty=Number(String(PQ.qty).replace(',','.'));

async function setRequest(btn,id,st){const r=S.reqs.find(x=>x.id===id);let ans=null;

    if(st==='recibido'&&r?.part_id&&confirm('¿Cargar ahora el ingreso al stock de este repuesto?')){MV={type:'entrada',part:r.part_id,qty:Math.round(Number(r.quantity))||1,machine:'',orig:'',cost:'',notes:'Pedido recibido'};go('repuestos')}}

/* ===================== AVISOS PUSH ===================== */
const pushSupported=()=>'serviceWorker' in navigator&&'PushManager' in window&&'Notification' in window;
const b64u=s=>{const b=atob((s+'='.repeat((4-s.length%4)%4)).replace(/-/g,'+').replace(/_/g,'/'));return Uint8Array.from(b,c=>c.charCodeAt(0))};
async function pushState(){if(isIOS()&&!isStandalone())return 'instalar';if(!pushSupported())return 'nosoporta';if(Notification.permission==='denied')return 'bloqueado';
  try{const reg=await navigator.serviceWorker.ready;return (await reg.pushManager.getSubscription())?'on':'off'}catch{return 'off'}}
async function saveSub(sub){const j=sub.toJSON();await rpc('save_push_subscription',{p_endpoint:j.endpoint,p_p256dh:j.keys.p256dh,p_auth:j.keys.auth,p_user_agent:navigator.userAgent})}
async function enablePush(btn){
  if(isIOS()&&!isStandalone())return toast('En iPhone primero instalá la app (Compartir → Agregar a pantalla de inicio) y abrila desde el ícono.','bad');
  if(!pushSupported())return toast('Este navegador no permite avisos. En Android usá Chrome.','bad');
  const perm=Notification.requestPermission(); // tiene que ser lo primero después del toque (iPhone)
  await busy(btn,async()=>{try{
    if(await perm!=='granted'){S.pushOn=Notification.permission==='denied'?'bloqueado':'off';render();return toast('No diste permiso para los avisos','bad')}
    const reg=await navigator.serviceWorker.ready;let sub=await reg.pushManager.getSubscription();
    if(!sub)sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64u(VAPID_PUBLIC)});
    await saveSub(sub);S.pushOn='on';toast('Avisos activados en este celular 🔔','good');render();
  }catch(e){toast('No se pudieron activar: '+(/save_push|schema cache/i.test(e.message)?'falta instalar el SQL de la V11.':e.message),'bad')}})}
async function testPush(btn){await busy(btn,async()=>{try{const n=await rpc('test_push');toast(n?'Aviso de prueba enviado. Tiene que llegar en unos segundos.':'Este usuario no tiene avisos activados en ningún celular.',n?'good':'bad')}catch(e){toast(e.message,'bad')}})}
async function syncPush(){S.pushOn=await pushState();if(S.pushOn!=='on')return;try{const reg=await navigator.serviceWorker.ready;const sub=await reg.pushManager.getSubscription();if(sub)await saveSub(sub)}catch{}}
async function unlinkPush(){try{const reg=await navigator.serviceWorker.ready;const sub=await reg.pushManager.getSubscription();if(sub){await rpc('delete_push_subscription',{p_endpoint:sub.endpoint}).catch(()=>{});await sub.unsubscribe()}}catch{}}
function pushBanner(){const st=S.pushOn;if(!st||st==='on'||st==='nosoporta'||S.v11Missing)return '';
  if(st==='instalar')return `<div class="note" style="margin-bottom:12px">🔔 Para recibir avisos de tareas nuevas en el iPhone, instalá la app: <b>Compartir → Agregar a pantalla de inicio</b> y abrila desde el ícono.</div>`;
  if(st==='bloqueado')return `<div class="note" style="margin-bottom:12px">🔕 Los avisos están bloqueados en este celular. Activalos en Ajustes → Notificaciones → Matenimiento (o en los permisos del sitio en Chrome).</div>`;
  return `<div class="card alta"><div class="title">🔔 Activá los avisos</div><p class="muted small" style="margin:6px 0 0">Así te llega una notificación cuando te asignan una tarea, aunque tengas la app cerrada.</p><button class="btn yel block" onclick="enablePush(this)">Activar avisos en este celular</button></div>`}
function pushCard(){const st=S.pushOn;const t={on:'✅ Activados en este celular',off:'Desactivados',bloqueado:'🔕 Bloqueados en los ajustes del celular',instalar:'Primero hay que instalar la app (iPhone)',nosoporta:'Este navegador no permite avisos'}[st]||'…';
  return `<div class="card"><h3>🔔 Avisos</h3><p class="muted small" style="margin-top:0">Estado: <b>${t}</b></p>
${st==='off'?'<button class="btn yel block" onclick="enablePush(this)">Activar avisos</button>':''}${st==='on'?'<button class="btn ghost block sm" onclick="testPush(this)">Mandarme un aviso de prueba</button>':''}</div>`}

function vMaquinas(){const q=S.machQ.toLowerCase();
  const lev=m=>critOf(m.id)?.level||'NONE';
  let list=MACHINES.filter(m=>!q||[m.id,m.name,m.sector,m.location].some(v=>v.toLowerCase().includes(q)));

  list=[...list].sort((a,b)=>(critOf(b.id)?.score||0)-(critOf(a.id)?.score||0));
  const cnt=k=>MACHINES.filter(m=>lev(m)===k).length;
  const open={};S.tasks.filter(t=>t.status!=='terminado').forEach(t=>{const id=(t.machine_label||'').split(' · ')[0];open[id]=(open[id]||0)+1});
  const local=localCritToImport();
  return `<button class="btn ghost sm" onclick="go('mas')">← Más</button><h2>Máquinas y criticidad</h2>
${S.critMissing?'<div class="err" style="margin-bottom:12px">La criticidad todavía no está activada en la base de datos. Hay que correr el SQL de la V10 en Supabase.</div>':''}
<div class="stats"><div class="stat red" onclick="S.critF='ALTA';render()"><b>${cnt('ALTA')}</b><span>Criticidad ALTA</span></div><div class="stat" onclick="S.critF='MEDIA';render()"><b>${cnt('MEDIA')}</b><span>Criticidad MEDIA</span></div><div class="stat" onclick="S.critF='BAJA';render()"><b>${cnt('BAJA')}</b><span>Criticidad BAJA</span></div><div class="stat ${cnt('NONE')?'yel':''}" onclick="S.critF='NONE';render()"><b>${cnt('NONE')}</b><span>Sin evaluar</span></div></div>
${local.length&&isBoss()&&!S.critMissing?`<div class="card alta"><div class="title">📲 Hay ${local.length} evaluaciones guardadas solo en este celular (versión anterior)</div><p class="muted small">Subilas a la base compartida para que las vea todo el equipo. Solo se suben las máquinas que todavía no tienen evaluación compartida.</p><button class="btn sm" onclick="importLocalCrit(this)">Subir a la base compartida</button></div>`:''}
<div class="seg">${[['todas','Todas'],['ALTA','Alta'],['MEDIA','Media'],['BAJA','Baja'],['NONE','Sin evaluar']].map(([k,l])=>`<button class="${S.critF===k?'on':''}" onclick="S.critF='${k}';render()">${l}</button>`).join('')}</div>
<input id="mSearch" placeholder="🔎 Buscar máquina, código o sector" value="${esc(S.machQ)}" oninput="S.machQ=this.value;clearTimeout(window._mq);window._mq=setTimeout(()=>{render();const e=$('mSearch');e.focus();e.setSelectionRange(e.value.length,e.value.length)},300)" style="margin-bottom:10px">
<div class="card">${list.map(m=>{const c=critOf(m.id);return `<div class="list-item" onclick="go('maquina',{mach:'${m.id}'})" style="cursor:pointer"><div class="line"><div><div class="title">${esc(m.id)} · ${esc(m.name)}</div><div class="muted small">${esc(m.sector)} · ${esc(m.location)}${open[m.id]?` · <b style="color:var(--warn)">${open[m.id]} tarea${open[m.id]>1?'s':''} abierta${open[m.id]>1?'s':''}</b>`:''}</div></div><div style="text-align:right">${critBadge(m.id,true)||'<span class="badge">—</span>'}${c?`<div class="muted small">${c.score.toFixed?c.score.toFixed(2):c.score}</div>`:''}</div></div></div>`}).join('')||'<p class="muted">No hay máquinas en esta lista.</p>'}</div>`}
function vMaquina(){const m=MACHINES.find(x=>x.id===S.mach);if(!m)return vMaquinas();const lbl=machineLabel(m);
  const tasks=S.tasks.filter(t=>t.machine_label===lbl),works=S.parts.filter(p=>p.machine_label===lbl),mv=S.moves.filter(x=>x.machine_code===m.id),names=Object.fromEntries(S.inv.map(i=>[i.id,i.part_name]));

let CE=null; // evaluación en edición
function critCard(m){
  const c=critOf(m.id);
  if(!isBoss()||S.critMissing){
    if(!c)return `<div class="card"><h3>Criticidad</h3><p class="muted">${S.critMissing?'La criticidad todavía no está activada en la base de datos.':'Esta máquina todavía no fue evaluada. La evalúa el jefe o el supervisor.'}</p></div>`;
    return `<div class="card ${c.level==='ALTA'?'urgent':c.level==='MEDIA'?'alta':'accent'}"><div class="line"><h3>Criticidad</h3>${critBadge(m.id)}</div><p style="margin:0 0 6px">Puntaje <b>${Number(c.score).toFixed(2)}</b> / 5${c.safety_risk?' · ⚠️ Riesgo de seguridad':''}</p>
    <table class="mini">${CRIT.map(k=>`<tr><td>${k.name} <span class="muted small">(${k.w}%)</span></td><td><b>${c[k.k]}/5</b><div class="muted small">${esc(k.opts[c[k.k]-1])}</div></td></tr>`).join('')}</table>
    ${c.notes?`<div class="note">${esc(c.notes)}</div>`:''}<p class="muted small">Evaluó ${esc(nameOf(c.updated_by))} · ${fmtDT(c.updated_at)}</p></div>`}
  if(!CE||CE.code!==m.id)CE={code:m.id,...Object.fromEntries(CRIT.map(k=>[k.k,c?.[k.k]||0])),safety_risk:!!c?.safety_risk,notes:c?.notes||''};
  const r=critCalc(CE);
  return `<div class="card ${r?.level==='ALTA'?'urgent':r?.level==='MEDIA'?'alta':'accent'}"><div class="line"><h3>Criticidad</h3>${c?critBadge(m.id):'<span class="badge">Sin evaluar</span>'}</div>
  ${CRIT.map(k=>`<label>${k.name} <span class="muted small" style="font-weight:400">(${k.w}%)</span></label><select onchange="CE['${k.k}']=Number(this.value);critRefresh()"><option value="0">Elegí 1 a 5…</option>${k.opts.map((o,i)=>`<option value="${i+1}" ${CE[k.k]===i+1?'selected':''}>${i+1} · ${esc(o)}</option>`).join('')}</select>`).join('')}
  <label style="font-weight:400;margin-top:14px"><input type="checkbox" style="width:auto" ${CE.safety_risk?'checked':''} onchange="CE.safety_risk=this.checked;critRefresh()"> <b>Riesgo grave para la seguridad de las personas</b> (pasa a ALTA automáticamente)</label>
  <label>Justificación / observaciones</label><textarea style="min-height:64px" oninput="CE.notes=this.value" placeholder="Ej: sin equipo alternativo; motor con entrega de 30 días">${esc(CE.notes)}</textarea>
  <div id="critRes" class="info" style="margin-top:12px">${critResText(r)}</div>
  <button class="btn block" onclick="saveCrit(this,'${m.id}')">Guardar evaluación</button>
  ${c?`<p class="muted small">Última evaluación: ${esc(nameOf(c.updated_by))} · ${fmtDT(c.updated_at)}</p>`:''}</div>`}
const critResText=r=>r?`Puntaje <b>${r.score.toFixed(2)}</b> / 5 → <b>Criticidad ${r.level}</b>`:'Completá los cuatro criterios para calcular la criticidad.';
function critRefresh(){const e=$('critRes');if(e)e.innerHTML=critResText(critCalc(CE))}
async function saveCrit(btn,code){const r=critCalc(CE);if(!r)return toast('Completá los cuatro criterios','bad');const m=MACHINES.find(x=>x.id===code);
  await busy(btn,async()=>{try{const row=await rpc('save_machine_criticality',{p_machine_code:code,p_machine_name:m?.name||null,p_production_impact:CE.production_impact,p_no_alternative:CE.no_alternative,p_failure_frequency:CE.failure_frequency,p_quality_impact:CE.quality_impact,p_safety_risk:CE.safety_risk,p_notes:CE.notes||null});
    const x=Array.isArray(row)?row[0]:row;if(x)S.crit[code]=x;CE=null;toast('Criticidad guardada: '+(x?.level||r.level),'good');render()}catch(e){toast(e.message,'bad')}})}
function localCritToImport(){const d=store.get('facilitas_criticidad_v1',{})||{};
  return Object.entries(d).map(([code,v])=>({code,v:{...Object.fromEntries(CRIT.map(k=>[k.k,Number(v?.[k.old])])),safety_risk:!!v?.safety,notes:v?.notes||''}})).filter(x=>!S.crit[x.code]&&MACHINES.some(m=>m.id===x.code)&&critCalc(x.v))}
async function importLocalCrit(btn){const list=localCritToImport();if(!confirm(`¿Subir ${list.length} evaluaciones de este celular a la base compartida?`))return;
  await busy(btn,async()=>{let ok=0,bad=0;for(const {code,v} of list){const m=MACHINES.find(x=>x.id===code);
    try{const row=await rpc('save_machine_criticality',{p_machine_code:code,p_machine_name:m?.name||null,p_production_impact:v.production_impact,p_no_alternative:v.no_alternative,p_failure_frequency:v.failure_frequency,p_quality_impact:v.quality_impact,p_safety_risk:v.safety_risk,p_notes:v.notes||null});const x=Array.isArray(row)?row[0]:row;if(x)S.crit[code]=x;ok++}catch{bad++}}
    toast(`Subidas ${ok} evaluaciones${bad?' · '+bad+' con error':''}`,bad?'bad':'good');render()})}

let gTokenClient=null;
function googleToken(){return new Promise((res,rej)=>{
  if(!window.google?.accounts?.oauth2)return rej(Error('No cargó el servicio de Google. Revisá la conexión y probá de nuevo.'));
  const cached=store.get('mat10_gtoken',null);if(cached&&cached.exp>Date.now()+60000)return res(cached.t);
  gTokenClient=google.accounts.oauth2.initTokenClient({client_id:GOOGLE_CLIENT_ID,scope:'https://www.googleapis.com/auth/drive.file',
    callback:r=>r?.access_token?(store.set('mat10_gtoken',{t:r.access_token,exp:Date.now()+(r.expires_in||3600)*1000}),res(r.access_token)):rej(Error(r?.error_description||r?.error||'Google no autorizó')),
    error_callback:e=>rej(Error(e?.type==='popup_closed'?'Cerraste la ventana de Google antes de autorizar':e?.type==='popup_failed_to_open'?'El navegador bloqueó la ventana de Google. Permití ventanas emergentes.':(e?.message||'Autorización cancelada')))});
  gTokenClient.requestAccessToken({prompt:store.get('mat10_gok',false)?'':'consent'});
})}
async function gfetch(url,token,opt={}){const r=await fetch(url,{...opt,headers:{Authorization:'Bearer '+token,...(opt.headers||{})}});const j=await r.json().catch(()=>({}));
  if(r.status===401){store.del('mat10_gtoken');throw Error('El permiso de Google venció. Tocá de nuevo el botón.')}
  if(!r.ok)throw Error(j?.error?.message||('Google Drive respondió '+r.status));return j}
async function driveFolder(token){
  const saved=store.get('mat10_gfolder',null);
  if(saved){try{const f=await gfetch(`https://www.googleapis.com/drive/v3/files/${saved}?fields=id,trashed`,token);if(!f.trashed)return saved}catch{}}
  const q=encodeURIComponent(`name='${DRIVE_FOLDER}' and mimeType='application/vnd.google-apps.folder' and trashed=false`);
  const l=await gfetch(`https://www.googleapis.com/drive/v3/files?q=${q}&fields=files(id)&spaces=drive`,token);
  let id=l.files?.[0]?.id;
  if(!id)id=(await gfetch('https://www.googleapis.com/drive/v3/files?fields=id',token,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:DRIVE_FOLDER,mimeType:'application/vnd.google-apps.folder'})})).id;
  store.set('mat10_gfolder',id);return id;
}
async function reportToDrive(btn){
  // Pedir el permiso de Google primero (debe ocurrir inmediatamente después del toque, si no Safari bloquea la ventana)
  let token;try{iMsg('Autorizando Google Drive…');token=await googleToken();store.set('mat10_gok',true)}catch(e){return iMsg(esc(e.message),'err')}
  await busy(btn,async()=>{try{
    iMsg('Preparando el Excel…');const r=await buildReport();
    iMsg('Subiendo a Google Drive…');const folder=await driveFolder(token);
    const bnd='mat'+Math.random().toString(36).slice(2),XL='application/vnd.openxmlformats-officedocument.spreadsheetml.sheet';
    const body=new Blob([`--${bnd}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n`+JSON.stringify({name:r.name,parents:[folder],mimeType:XL})+`\r\n--${bnd}\r\nContent-Type: ${XL}\r\n\r\n`,r.blob,`\r\n--${bnd}--`]);
    const f=await gfetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id,name,webViewLink',token,{method:'POST',headers:{'Content-Type':'multipart/related; boundary='+bnd},body});
    iMsg(`✅ Guardado en Drive: <b>${esc(f.name)}</b><br>${esc(r.summary)}<br><a href="${esc(f.webViewLink)}" target="_blank" rel="noopener">Abrir en Google Drive</a>`,'info');
  }catch(e){iMsg('No se guardó en Drive: '+esc(e.message),'err')}});
}
/* Generador de .xlsx sin librerías externas (formato Office Open XML) */
function xlsx(sheets){
  const X=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])).replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g,'');
  const col=n=>{let s='';for(n++;n;n=Math.floor((n-1)/26))s=String.fromCharCode(65+(n-1)%26)+s;return s};
  // estilos: 0 normal,1 título,2 subtítulo,3 encabezado,4 celda,5 celda 0.00,6 celda $,7 celda alternada,8 alt 0.00,9 alt $
  const cell=(r,c,v,alt)=>{const ref=col(c)+r;if(v&&typeof v==='object'&&v.link){const u=String(v.link).replace(/"/g,'""'),t=String(v.text).replace(/"/g,'""');return `<c r="${ref}" s="${alt?11:10}" t="str"><f>${X(`HYPERLINK("${u}","${t}")`)}</f><v>${X(v.text)}</v></c>`}
    if(v&&typeof v==='object'){const s=v.f===3?(alt?9:6):(alt?8:5);return `<c r="${ref}" s="${s}"><v>${Number.isFinite(v.n)?v.n:0}</v></c>`}
    if(typeof v==='number'&&Number.isFinite(v))return `<c r="${ref}" s="${alt?7:4}"><v>${v}</v></c>`;return `<c r="${ref}" s="${alt?7:4}" t="inlineStr"><is><t xml:space="preserve">${X(v)}</t></is></c>`};
  const sheetXml=sh=>{const n=sh.head.length,last=col(n-1),end=3+sh.rows.length;
    let rows=`<row r="1" ht="26" customHeight="1"><c r="A1" s="1" t="inlineStr"><is><t>${X(sh.title)}</t></is></c></row><row r="2"><c r="A2" s="2" t="inlineStr"><is><t>${X(sh.sub)}</t></is></c></row>`;
    rows+=`<row r="3" ht="22" customHeight="1">${sh.head.map((h,i)=>`<c r="${col(i)}3" s="3" t="inlineStr"><is><t>${X(h)}</t></is></c>`).join('')}</row>`;
    sh.rows.forEach((r,i)=>{rows+=`<row r="${i+4}">${r.map((v,j)=>cell(i+4,j,v,i%2===1)).join('')}</row>`});
    return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheetViews><sheetView workbookViewId="0" showGridLines="0"><pane ySplit="3" topLeftCell="A4" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews><cols>${sh.w.map((w,i)=>`<col min="${i+1}" max="${i+1}" width="${w}" customWidth="1"/>`).join('')}</cols><sheetData>${rows}</sheetData>${sh.rows.length?`<autoFilter ref="A3:${last}${end}"/>`:''}<mergeCells count="2"><mergeCell ref="A1:${n>1?last:'B'}1"/><mergeCell ref="A2:${n>1?last:'B'}2"/></mergeCells><pageSetup orientation="landscape" fitToWidth="1" fitToHeight="0"/></worksheet>`};
  const b='<border><left style="thin"><color rgb="FFDDDDDD"/></left><right style="thin"><color rgb="FFDDDDDD"/></right><top style="thin"><color rgb="FFDDDDDD"/></top><bottom style="thin"><color rgb="FFDDDDDD"/></bottom></border>';
  const styles=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><numFmts count="1"><numFmt numFmtId="164" formatCode="&quot;$&quot; #,##0.00"/></numFmts><fonts count="5"><font><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="15"/><color rgb="FFFFFFFF"/><name val="Calibri"/></font><font><i/><sz val="10"/><color rgb="FF555555"/><name val="Calibri"/></font><font><b/><sz val="11"/><color rgb="FFFFFFFF"/><name val="Calibri"/></font><font><u/><sz val="11"/><color rgb="FF1D5FA8"/><name val="Calibri"/></font></fonts><fills count="6"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill><fill><patternFill patternType="solid"><fgColor rgb="FFB72C37"/></patternFill></fill><fill><patternFill patternType="solid"><fgColor rgb="FF7E1928"/></patternFill></fill><fill><patternFill patternType="solid"><fgColor rgb="FFFBF3F4"/></patternFill></fill><fill><patternFill patternType="solid"><fgColor rgb="FFFFF7D1"/></patternFill></fill></fills><borders count="2"><border/>${b}</borders><cellStyleXfs count="1"><xf/></cellStyleXfs><cellXfs count="12"><xf/><xf fontId="1" fillId="2" applyFont="1" applyFill="1"><alignment vertical="center"/></xf><xf fontId="2" fillId="5" applyFont="1" applyFill="1"/><xf fontId="3" fillId="3" borderId="1" applyFont="1" applyFill="1" applyBorder="1"><alignment vertical="center" wrapText="1"/></xf><xf borderId="1" applyBorder="1"><alignment vertical="top" wrapText="1"/></xf><xf numFmtId="2" borderId="1" applyNumberFormat="1" applyBorder="1"><alignment vertical="top"/></xf><xf numFmtId="164" borderId="1" applyNumberFormat="1" applyBorder="1"><alignment vertical="top"/></xf><xf fillId="4" borderId="1" applyFill="1" applyBorder="1"><alignment vertical="top" wrapText="1"/></xf><xf numFmtId="2" fillId="4" borderId="1" applyNumberFormat="1" applyFill="1" applyBorder="1"><alignment vertical="top"/></xf><xf numFmtId="164" fillId="4" borderId="1" applyNumberFormat="1" applyFill="1" applyBorder="1"><alignment vertical="top"/></xf><xf fontId="4" borderId="1" applyFont="1" applyBorder="1"><alignment vertical="top"/></xf><xf fontId="4" fillId="4" borderId="1" applyFont="1" applyFill="1" applyBorder="1"><alignment vertical="top"/></xf></cellXfs></styleSheet>`;
  const files=[['[Content_Types].xml',`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>${sheets.map((_,i)=>`<Override PartName="/xl/worksheets/sheet${i+1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`).join('')}</Types>`],
    ['_rels/.rels','<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>'],
    ['xl/workbook.xml',`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>${sheets.map((s,i)=>`<sheet name="${X(s.name.slice(0,31))}" sheetId="${i+1}" r:id="rId${i+1}"/>`).join('')}</sheets><definedNames>${sheets.map((s,i)=>s.rows.length?`<definedName name="_xlnm._FilterDatabase" localSheetId="${i}" hidden="1">'${X(s.name.slice(0,31))}'!$A$3:$${col(s.head.length-1)}$${3+s.rows.length}</definedName>`:'').join('')}</definedNames></workbook>`],
    ['xl/_rels/workbook.xml.rels',`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">${sheets.map((_,i)=>`<Relationship Id="rId${i+1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${i+1}.xml"/>`).join('')}<Relationship Id="rId${sheets.length+1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>`],
    ['xl/styles.xml',styles],...sheets.map((s,i)=>[`xl/worksheets/sheet${i+1}.xml`,sheetXml(s)])];
  return zip(files,'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet');
}
function zip(entries,type){const enc=new TextEncoder(),out=[],central=[];let off=0;
  const T=zip.t||(zip.t=Array.from({length:256},(_,n)=>{for(let i=0;i<8;i++)n=n&1?0xedb88320^(n>>>1):n>>>1;return n>>>0}));
  const crc=b=>{let c=~0;for(const x of b)c=T[(c^x)&255]^(c>>>8);return(~c)>>>0};
  for(const [name,content] of entries){const nb=enc.encode(name),d=enc.encode(content),c=crc(d);
    const l=new DataView(new ArrayBuffer(30));l.setUint32(0,0x04034b50,true);l.setUint16(4,20,true);l.setUint16(6,0x0800,true);l.setUint32(14,c,true);l.setUint32(18,d.length,true);l.setUint32(22,d.length,true);l.setUint16(26,nb.length,true);
    out.push(l.buffer,nb,d);
    const h=new DataView(new ArrayBuffer(46));h.setUint32(0,0x02014b50,true);h.setUint16(4,20,true);h.setUint16(6,20,true);h.setUint16(8,0x0800,true);h.setUint32(16,c,true);h.setUint32(20,d.length,true);h.setUint32(24,d.length,true);h.setUint16(28,nb.length,true);h.setUint32(42,off,true);
    central.push(h.buffer,nb);off+=30+nb.length+d.length}
  const cs=central.reduce((s,b)=>s+(b.byteLength),0),e=new DataView(new ArrayBuffer(22));e.setUint32(0,0x06054b50,true);e.setUint16(8,entries.length,true);e.setUint16(10,entries.length,true);e.setUint32(12,cs,true);e.setUint32(16,off,true);
  return new Blob([...out,...central,e.buffer],{type});
}

/* ===================== INSTALACIÓN (Android / iPhone) ===================== */
let installEvt=null;
const isStandalone=()=>matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
const isIOS=()=>/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
const isAndroid=()=>/android/i.test(navigator.userAgent);
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installEvt=e;if(['login','mas','ayuda'].includes(S.view))render()});
window.addEventListener('appinstalled',()=>{installEvt=null;toast('App instalada. Abrila desde el ícono de Facilitas.','good');render()});
function installBox(){if(isStandalone())return '';
  if(installEvt)return `<button class="btn yel block" onclick="doInstall()">📲 Instalar la app en este celular</button>`;
  if(isIOS())return `<div class="info" style="margin-top:12px">📲 Para instalarla: en <b>Safari</b> tocá <b>Compartir</b> → <b>Agregar a pantalla de inicio</b>.</div>`;
  if(isAndroid())return `<div class="info" style="margin-top:12px">📲 Para instalarla: en <b>Chrome</b> tocá los <b>tres puntos ⋮</b> → <b>Instalar aplicación</b> (o "Agregar a pantalla principal").</div>`;
  return ''}
async function doInstall(){if(!installEvt)return;installEvt.prompt();const r=await installEvt.userChoice.catch(()=>null);installEvt=null;if(r?.outcome!=='accepted')toast('Podés instalarla más tarde desde Más','');render()}

/* ===================== ARRANQUE ===================== */
async function start(){
  if(!session){go('login');return}
  try{if(session.expires_at*1000-Date.now()<90000&&!(await refreshToken()))return go('login');
    await loadMe();
    if(!S.me){toast('No se encontró tu perfil. Avisale al supervisor.','bad');return go('login')}
    const meta=store.get('mat10_pending_meta',null);
    if(meta&&!S.me.first_name){try{await api('/rest/v1/profiles?id=eq.'+myId(),{method:'PATCH',body:meta});await loadMe()}catch{}}
    if(S.me.first_name)store.del('mat10_pending_meta');
    if(S.me.approved!==true)return go('pending');
    S.view=['login','signup','pending','recovery'].includes(S.view)?'inicio':S.view;render();await refresh();
    syncPush().then(()=>{if(['inicio','perfil'].includes(S.view))render()});
  }catch(e){if(!session)return go('login');$('app').innerHTML=`<div class="card"><h3>Sin conexión</h3><p class="muted">${esc(e.message)}</p><button class="btn block" onclick="start()">Reintentar</button></div>`}
}
(function init(){
  const qv=new URLSearchParams(location.search).get('v');if(qv&&['tareas','pedidos','inicio'].includes(qv)){S.view=qv;history.replaceState(null,'',location.pathname)}
  if('serviceWorker' in navigator)navigator.serviceWorker.addEventListener('message',e=>{if(e.data?.type==='abrir'&&session&&S.me?.approved){refresh();if(e.data.view)go(e.data.view)}});
  const h=new URLSearchParams(location.hash.slice(1));
  if(h.get('access_token')){saveSession({access_token:h.get('access_token'),refresh_token:h.get('refresh_token'),expires_in:Number(h.get('expires_in')||3600),user:null});
    history.replaceState(null,'',location.pathname);
    raw('/auth/v1/user').then(u=>{session.user=u;saveSession(session);if(h.get('type')==='recovery'){S.view='recovery';render()}else start()}).catch(()=>{toast('El enlace venció. Pedí uno nuevo.','bad');logout()});return}
  if(h.get('error_description')){history.replaceState(null,'',location.pathname);toast(h.get('error_description'),'bad')}
  start();
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&session&&S.me?.approved)refresh()});
  setInterval(()=>{if(document.visibilityState==='visible'&&session&&S.me?.approved&&['inicio','tareas'].includes(S.view))refresh()},120000);
  if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
})();
